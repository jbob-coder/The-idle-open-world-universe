<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}

#top span{font-size:12px;color:#d2e9da}

#panel dt{color:#b4caba}#panel dd{margin:0;font-weight:650;text-align:right}

#bottom{position:fixed;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;flex-wrap:wrap;pointer-events:auto}
button{background:#213731;border:1px solid #a5cbb26b;color:#fff2d5;border-radius:7px;padding:9px 11px;font-size:12px;font-weight:600;min-height:40px;cursor:pointer}
button:focus-visible{outline:2px solid #f5da92}

#panel h2{font-size:12px}#events,#memories{max-height:48px}#hint{display:none}#top strong{font-size:11px}
#bottom button{padding:7px;font-size:11px;min-height:35px}}

<body>
<canvas id="scene" aria-label="Mundo 3D autónomo de GODSEED"></canvas>
<div id="top"><strong>GODSEED · V3 PREVIEW</strong><span id="headline">Iniciando mundo sin conexión…</span></div>
<div id="hint">Arrastra para girar la cámara · rueda o botones +/- para acercar</div>
<aside id="panel" aria-label="Observatorio del mundo">
<h2>Observatorio divino</h2><dl id="stats"></dl>
<div id="citizens" aria-live="off"></div>
<h2>Recuerdos de Aria</h2><div id="memories"></div>
<h2>Crónica de decisiones</h2><div id="events"></div>
</aside>
<div id="bottom">
<button id="pause" type="button" aria-pressed="false">Pausar</button>
<button id="step" type="button">Paso</button>
<button id="speed" type="button">Velocidad ×1</button>
<button id="zoomIn" type="button">Acercar +</button>
<button id="zoomOut" type="button">Alejar −</button>
<button id="save" type="button">Guardar</button>
<button id="reset" type="button">Mundo nuevo</button>
<button id="mode" type="button">Modo sociedad</button>
</div>
<div id="warning" role="alert"></div>
<script>/* GODSEED V3 opt-in autonomous simulation. Existing v1 saves are untouched. */
(function(root,factory){"use strict";const api=factory();
  if(typeof module!=="undefined"&&module.exports)module.exports=api;
  if(root)root.GodseedV3Sim=api;
})(typeof globalThis!=="undefined"?globalThis:this,function(){"use strict";
  const VERSION=3,SIZE=20,STORAGE_KEY="godseed-v3-prototype-v1";
  const copy=x=>JSON.parse(JSON.stringify(x));
  const pos=(x,z)=>Number.isSafeInteger(x)&&Number.isSafeInteger(z)&&x>=0&&z>=0&&x<SIZE&&z<SIZE;
  const uint32=x=>Number.isSafeInteger(x)&&x>=0&&x<=0xffffffff;
  const distance=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.z-b.z);
  function forestFor(seed){
    const found=[];
    for(let z=1;z<SIZE-1;z++)for(let x=1;x<SIZE-1;x++){
      if(x>=3&&x<=7&&z>=3&&z<=6)continue;
      const h=Math.imul(x+11,73856093)^Math.imul(z+17,19349663)^Math.imul(seed+1,83492791);
      if((h>>>0)%11<2)found.push({x,z});
    }
    for(const p of [{x:3,z:8},{x:8,z:6},{x:9,z:8},{x:5,z:10},{x:11,z:5},{x:7,z:11}]){
      if(!found.some(q=>q.x===p.x&&q.z===p.z))found.push(p);
    }
    return found.sort((a,b)=>a.z-b.z||a.x-b.x);
  }
  // Seed-derived personality; observable, bounded cognition with no external AI services.
  const clamp=x=>Math.max(0,Math.min(100,x));
  const LANDMARKS=[{x:2,z:2},{x:10,z:4},{x:11,z:9},{x:6,z:12},
    {x:3,z:11},{x:13,z:5},{x:10,z:14},{x:14,z:13}];
  const remembered=new Set(["forage","eat","build","discover","reflect","hardship"]);
  function makeMind(seed,c,s){
    return {personality:{
      curiosity:40+(seed%41),
      caution:30+((seed>>>7)%51)
    },emotions:{contentment:55,stress:10},
    skills:{foraging:Math.min(100,s.foodGathered*2),woodworking:Math.min(100,c.harvested*8)},
    memories:[],visited:[c.z*SIZE+c.x],reflections:0};
  }
  function memory(s,c,action,details){
    if(!c.mind||!remembered.has(action))return;
    const m=c.mind.memories;
    // First meal/forage and construction are durable milestones, not spam.
    if((action==="eat"||action==="forage")&&m.some(v=>v.kind===action))return;
    if(action==="reflect"&&s.tick%30!==0)return;
    const entry={tick:s.tick,kind:action,x:c.x,z:c.z,
      valence:action==="hardship"?-2:action==="build"?2:1};
    if(action==="discover"&&details&&pos(details.x,details.z)){
      entry.x=details.x;entry.z=details.z;
    }
    if(m.length>=20){
      const index=m.findIndex(v=>v.kind!=="build"&&v.kind!=="eat"&&v.kind!=="forage");
      m.splice(index<0?0:index,1);
    }
    m.push(entry);
  }
  function visit(c){
    const key=c.z*SIZE+c.x;
    if(!c.mind.visited.includes(key))c.mind.visited.push(key);
  }
  function explore(s,c){
    const m=c.mind;
    if(m.personality.curiosity<46||m.emotions.stress>=28||
      c.hunger<72||c.energy<9)return false;
    const points=LANDMARKS;
    // Choosing a new landmark depends on remembered visited cells.
    const next=points.find(p=>!m.visited.includes(p.z*SIZE+p.x));
    if(!next)return false;
    walk(c,next);
    c.goal="explorar terreno";
    visit(c);
    if(c.x===next.x&&c.z===next.z)
      record(s,c,"discover",{x:next.x,z:next.z});
    return true;
  }

  function record(s,c,action,details){
    s.events.push({tick:s.tick,actor:c.id,action,details});
    if(s.events.length>48)s.events.shift();
    if(c.mind){
      const mood=c.mind.emotions;
      const effects={harvest:[1,0],forage:[2,-2],eat:[5,-5],
        build:[20,-15],rest:[1,-3],discover:[6,-3],
        reflect:[3,-10],hardship:[-8,9]};
      const delta=effects[action];
      if(delta){
        mood.contentment=clamp(mood.contentment+delta[0]);
        mood.stress=clamp(mood.stress+delta[1]);
      }
      memory(s,c,action,details);
    }
  }
  function nearestTree(c,forest){
    let best=null,score=Infinity;
    for(const t of forest){
      const bias=c.trait==="explorer"?Math.abs(t.z-10)/12:Math.abs(t.x-7)/12;
      const next=distance(c,t)+bias;
      if(next<score){score=next;best=t;}
    }
    return best;
  }
  // Four renewable patches inside the treeless village clearing; no randomness per tick.
  const GROVE=[{x:3,z:4},{x:4,z:6},{x:6,z:4},{x:7,z:6}];
  function groveFor(){return GROVE.map(p=>({x:p.x,z:p.z,berries:3}));}
  function nearestBush(c,bushes){
    let best=null,dist=Infinity;
    for(const b of bushes)if(b.berries>0){
      const d=distance(c,b);
      if(d<dist){dist=d;best=b;}
    }
    return best;
  }
  function walk(c,target){
    if(c.x!==target.x)c.x+=Math.sign(target.x-c.x);
    else c.z+=Math.sign(target.z-c.z);
    c.energy=Math.max(0,c.energy-1);
  }
  function act(s,c){
    if(!c.alive){c.goal="sin vida";return;}
    if(c.hunger<=60&&s.food>0){
      s.food--;s.foodEaten++;c.hunger=Math.min(100,c.hunger+38);
      c.goal="comer";record(s,c,"eat",{foodSpent:1});return;
    }
    if(c.energy<5&&!(c.hunger<20&&s.food===0)){
      c.energy=Math.min(20,c.energy+8);c.goal="descansar";
      record(s,c,"rest",{energy:c.energy});return;
    }
    // Food takes priority over building and wood reserves.
    const foodTarget=2+Math.floor(c.mind.personality.caution/24);
    if(s.food<foodTarget||c.hunger<=60){
      const bush=nearestBush(c,s.bushes);
      if(bush){
        if(distance(c,bush)<=1){
          bush.berries--;s.food++;s.foodGathered++;
          c.energy=Math.max(0,c.energy-(c.mind.skills.foraging>=30?1:2));
          c.mind.skills.foraging=Math.min(100,c.mind.skills.foraging+2);
          c.goal="recolectar bayas";
          record(s,c,"forage",{x:bush.x,z:bush.z,foodProduced:1});
        }else{walk(c,bush);c.goal="buscar alimento";}
        return;
      }
      if(c.hunger<=60){
        c.energy=Math.min(20,c.energy+1);c.goal="esperar frutos";return;
      }
    }
    if(!s.structures.length&&s.wood>=4){
      s.wood-=4;s.spent+=4;s.structures.push({id:"first_shelter",type:"house",x:5,z:5});
      c.energy=Math.max(0,c.energy-2);c.goal="construir refugio";
      record(s,c,"build",{id:"first_shelter",woodSpent:4});return;
    }
    if(!s.structures.length||s.wood<4){
      const tree=nearestTree(c,s.forest);
      if(tree){
        if(distance(c,tree)<=1){
          const i=s.forest.findIndex(t=>t.x===tree.x&&t.z===tree.z);
          if(i<0)throw new Error("resource ownership conflict");
          s.forest.splice(i,1);s.wood++;s.harvested++;c.harvested++;
          c.energy=Math.max(0,c.energy-(c.mind.skills.woodworking>=32?2:3));
          c.mind.skills.woodworking=Math.min(100,c.mind.skills.woodworking+8);
          c.goal="recolectar madera";
          record(s,c,"harvest",{x:tree.x,z:tree.z,woodProduced:1});
        }else{walk(c,tree);c.goal="caminar hacia recurso";}
        return;
      }
      c.goal="sin madera";c.energy=Math.min(20,c.energy+1);return;
    }
    const home=s.structures[0];
    if(c.mind.emotions.stress>=28){
      if(distance(c,home)>1){walk(c,home);c.goal="buscar seguridad";}
      else{
        c.energy=Math.min(20,c.energy+3);c.mind.reflections++;
        c.goal="reflexionar en refugio";
        record(s,c,"reflect",{relief:10});
      }
      return;
    }
    if(explore(s,c))return;
    if(distance(c,home)>1){walk(c,home);c.goal="regresar al refugio";}
    else{c.energy=Math.min(20,c.energy+2);c.goal="cuidar refugio";}
  }
  function validateLegacy(s){
    if(!s||typeof s!=="object"||Array.isArray(s)||s.schemaVersion!==1||
      !uint32(s.seed)||!Number.isSafeInteger(s.tick)||s.tick<0||
      !Array.isArray(s.citizens)||s.citizens.length!==2||
      !Array.isArray(s.forest)||!Array.isArray(s.structures)||s.structures.length>1||
      !Array.isArray(s.events)||s.events.length>48||
      !Number.isSafeInteger(s.wood)||s.wood<0||
      !Number.isSafeInteger(s.harvested)||s.harvested<0||
      !Number.isSafeInteger(s.spent)||s.spent<0||s.wood!==s.harvested-s.spent)return false;
    const original=forestFor(s.seed),keys=new Set();
    if(s.harvested+s.forest.length!==original.length)return false;
    for(const t of s.forest){
      if(!t||!pos(t.x,t.z)||!original.some(p=>p.x===t.x&&p.z===t.z))return false;
      const key=t.x+","+t.z;if(keys.has(key))return false;keys.add(key);
    }
    const expected=[["sim_aria","explorer"],["sim_bran","builder"]];
    for(let i=0;i<2;i++){
      const c=s.citizens[i];
      if(!c||c.id!==expected[i][0]||c.trait!==expected[i][1]||
        !pos(c.x,c.z)||!Number.isInteger(c.energy)||c.energy<0||c.energy>20||
        !Number.isSafeInteger(c.harvested)||c.harvested<0||
        typeof c.goal!=="string"||c.goal.length>80)return false;
    }
    if(s.citizens[0].harvested+s.citizens[1].harvested!==s.harvested)return false;
    if(s.structures.length){
      const b=s.structures[0];
      if(!b||b.id!=="first_shelter"||b.type!=="house"||b.x!==5||b.z!==5||s.spent!==4)return false;
    }else if(s.spent!==0)return false;
    for(const e of s.events){
      if(!e||!Number.isSafeInteger(e.tick)||e.tick<0||e.tick>s.tick||
        !expected.some(c=>c[0]===e.actor)||!["build","harvest"].includes(e.action))return false;
    }
    return true;
  }
  // Preserve the exact V2 validator to reject malformed saves before migration.
  function validateV2(s){
    if(!s||typeof s!=="object"||Array.isArray(s)||s.schemaVersion!==2||
       !uint32(s.seed)||!Number.isSafeInteger(s.tick)||s.tick<0||
       !Array.isArray(s.citizens)||s.citizens.length!==1||
       !Array.isArray(s.forest)||!Array.isArray(s.structures)||s.structures.length>1||
       !Array.isArray(s.bushes)||s.bushes.length!==GROVE.length||
       !Array.isArray(s.events)||s.events.length>48)return false;
    for(const key of ["wood","harvested","spent","legacyHarvested",
      "food","foodGathered","foodEaten","foodGrown"]){
      if(!Number.isSafeInteger(s[key])||s[key]<0)return false;
    }
    if(s.wood!==s.harvested-s.spent||s.food!==s.foodGathered-s.foodEaten)return false;
    const original=forestFor(s.seed),keys=new Set();
    if(s.harvested+s.forest.length!==original.length)return false;
    for(const t of s.forest){
      if(!t||!pos(t.x,t.z)||!original.some(p=>p.x===t.x&&p.z===t.z))return false;
      const key=t.x+","+t.z;if(keys.has(key))return false;keys.add(key);
    }
    const c=s.citizens[0];
    if(!c||c.id!=="sim_aria"||c.name!=="Aria"||c.trait!=="explorer"||
       !pos(c.x,c.z)||!Number.isInteger(c.energy)||c.energy<0||c.energy>20||
       !Number.isInteger(c.hunger)||c.hunger<0||c.hunger>100||
       !Number.isInteger(c.health)||c.health<0||c.health>100||
       typeof c.alive!=="boolean"||c.alive!==(c.health>0)||
       !Number.isSafeInteger(c.harvested)||c.harvested<0||
       c.harvested+s.legacyHarvested!==s.harvested||
       typeof c.goal!=="string"||c.goal.length>80)return false;
    let berries=0;
    for(let i=0;i<GROVE.length;i++){
      const b=s.bushes[i],p=GROVE[i];
      if(!b||b.x!==p.x||b.z!==p.z||!Number.isInteger(b.berries)||
         b.berries<0||b.berries>3)return false;
      berries+=b.berries;
    }
    if(s.foodGathered+berries!==GROVE.length*3+s.foodGrown)return false;
    if(s.structures.length){
      const b=s.structures[0];
      if(!b||b.id!=="first_shelter"||b.type!=="house"||
         b.x!==5||b.z!==5||s.spent!==4)return false;
    }else if(s.spent!==0)return false;
    for(const e of s.events){
      if(!e||!Number.isSafeInteger(e.tick)||e.tick<0||e.tick>s.tick||
        !["sim_aria","sim_bran"].includes(e.actor)||
        !["build","harvest","forage","eat","rest"].includes(e.action))return false;
    }
    return true;
  }
  function validate(s){
    if(!s||s.schemaVersion!==VERSION)return false;
    // Audit conserved resources, forest, food and one-citizen structure with
    // the established V2 validator; only the two new factual action types differ.
    if(!Array.isArray(s.events)||s.events.length>48)return false;
    if(!s.events.every(e=>e&&Number.isSafeInteger(e.tick)&&e.tick>=0&&
        e.tick<=s.tick&&["sim_aria","sim_bran"].includes(e.actor)&&
        ["build","harvest","forage","eat","rest","discover","reflect","hardship"].includes(e.action)))return false;
    const prior=Object.assign({},s,{schemaVersion:2,
      events:s.events.filter(e=>!["discover","reflect","hardship"].includes(e.action))});
    if(!validateV2(prior))return false;
    const c=s.citizens[0],m=c.mind;
    if(!m||typeof m!=="object"||Array.isArray(m)||
      !m.personality||!m.emotions||!m.skills||!Array.isArray(m.memories)||
      m.memories.length>20||!Array.isArray(m.visited)||m.visited.length>SIZE*SIZE||
      !Number.isSafeInteger(m.reflections)||m.reflections<0||m.reflections>s.tick)
      return false;
    for(const [o,keys] of [[m.personality,["curiosity","caution"]],
      [m.emotions,["contentment","stress"]],
      [m.skills,["foraging","woodworking"]]]){
      if(!o||typeof o!=="object"||keys.some(k=>!Number.isInteger(o[k])||o[k]<0||o[k]>100))
        return false;
    }
    const seen=new Set();
    for(const key of m.visited){
      if(!Number.isInteger(key)||key<0||key>=SIZE*SIZE||seen.has(key))return false;
      seen.add(key);
    }
    if(!seen.has(c.z*SIZE+c.x))return false;
    let last=-1;
    for(const note of m.memories){
      if(!note||!Number.isSafeInteger(note.tick)||note.tick<0||
        note.tick>s.tick||note.tick<last||!remembered.has(note.kind)||
        !pos(note.x,note.z)||!Number.isInteger(note.valence)||
        note.valence<-2||note.valence>2)return false;
      last=note.tick;
    }
    return true;
  }

  function instance(state){
    function snapshot(){return copy(state);}
    function advance(n){
      if(!Number.isSafeInteger(n)||n<0||n>20000)throw new RangeError("invalid steps");
      for(let i=0;i<n;i++){
        state.tick++;
        if(state.tick%15===0)for(const b of state.bushes){
          if(b.berries<3){b.berries++;state.foodGrown++;}
        }
        for(const c of state.citizens){
          if(!c.alive)continue;
          c.hunger=Math.max(0,c.hunger-1);
          if(c.hunger===0)c.health=Math.max(0,c.health-2);
          else if(c.hunger>65)c.health=Math.min(100,c.health+1);
          c.alive=c.health>0;
          if(c.hunger<35&&state.tick%10===0)
            record(state,c,"hardship",{hunger:c.hunger});
          if(c.energy<=6||c.hunger<55)
            c.mind.emotions.stress=clamp(c.mind.emotions.stress+1);
          else if(state.tick%7===0)
            c.mind.emotions.stress=clamp(c.mind.emotions.stress-1);
          if(c.hunger<30&&state.tick%10===0)
            c.mind.emotions.contentment=clamp(c.mind.emotions.contentment-1);
          if(c.alive)act(state,c);
          visit(c);
        }
      }
      return snapshot();
    }
    function serialize(){
      const raw=JSON.stringify(state);
      if(raw.length>64000)throw new RangeError("save quota exceeded");
      return raw;
    }
    return Object.freeze({advance,snapshot,serialize});
  }
  function create(seed){
    if(!uint32(seed))throw new RangeError("seed must be uint32");
    const state={schemaVersion:VERSION,seed,tick:0,
      citizens:[{id:"sim_aria",name:"Aria",trait:"explorer",x:4,z:4,
        energy:20,hunger:85,health:100,alive:true,harvested:0,goal:"explorar"}],
      forest:forestFor(seed),wood:0,harvested:0,spent:0,legacyHarvested:0,
      bushes:groveFor(),food:0,foodGathered:0,foodEaten:0,foodGrown:0,
      structures:[],events:[]};
    state.citizens[0].mind=makeMind(seed,state.citizens[0],state);
    return instance(state);
  }
  // Old prototype saves are accepted only when they pass their original validation.
  // Bran's past harvesting stays attributed to an archived resource ledger.
  function migrateLegacy(s){
    if(!validateLegacy(s))throw new RangeError("corrupt V3 legacy save");
    const a=copy(s.citizens[0]),bran=s.citizens[1];
    a.hunger=85;a.health=100;a.alive=true;
    return Object.assign({},s,{schemaVersion:2,citizens:[a],
      legacyHarvested:bran.harvested,bushes:groveFor(),

<script>/* Autonomous two-community frontier extension for the isolated GODSEED V3 society.

   if(dist(c,t)>1){ctx.walk(c,t);c.goal=siteClear?"despejar solar":"talar junto al puesto";return true;}

     !number(o.deliveries)||s.structures.length>4||

     number(o.delivery.startedAt)&&o.delivery.startedAt<=s.tick&&
     s.citizens.some(c=>c.id===o.delivery.courierId&&c.id!==o.founderId))))return false;

       (est&&c.id===o.founderId&&c.homeId!==SITE_ID))return false;

<script>/* GODSEED V3: isolated, deterministic settlement prototype. No network or external AI. */
(function(root,factory){"use strict";const api=factory();

    require("./frontier.js"):globalThis.GodseedV3Frontier;

    {id:"sim_bran",name:"Bran",trait:"builder",x:16,z:15,skill:3},

    role:"unassigned",homeId:"village_01",memories:[],goal:"explorar",relations:{}};}

      const subject=details.with||details.site||details.recipe||details.role||
        details.policy||details.leader||details.settlement||null;
      remember(c,s.tick,action,subject);
    }
    if(action==="forage")c.foraged++;

   elevation=Math.max(.22,Math.min(1.42,elevation+dy*.8));}
  function zoom(delta){radius=Math.max(13,Math.min(52,radius+delta));}
  function render(s){
   if(!s||!Array.isArray(s.forest)||!Array.isArray(s.citizens)||!Array.isArray(s.structures))
    throw new TypeError("world snapshot required");
   const w=canvas.width,h=canvas.height;if(w<1||h<1)return;
   ctx.imageSmoothingEnabled=false;ctx.fillStyle="#17272c";ctx.fillRect(0,0,w,h);
   const scale=Math.min(w/28,h/22)*30/radius,cy=Math.cos(yaw),sy=Math.sin(yaw),
    se=Math.sin(elevation),ce=Math.cos(elevation);
   const project=(x,y,z)=>{let dx=x-10,dz=z-10;
    return [w*.5+(dx*cy-dz*sy)*scale,h*.5+((dx*sy+dz*cy)*se-y*ce)*scale];};
   const depth=(x,z)=>x*sy+z*cy;
   function poly(pts,color){ctx.beginPath();for(let i=0;i<pts.length;i++){
    const p=project(...pts[i]);if(!i)ctx.moveTo(...p);else ctx.lineTo(...p);
   }ctx.closePath();ctx.fillStyle=color;ctx.fill();}
   function cube(x,y,z,a,b,d,top,front,side){
    let x1=x+a,y1=y+b,z1=z+d;
    let faces=[
     {k:depth(x,z+d),col:front,p:[[x,y,z1],[x1,y,z1],[x1,y1,z1],[x,y1,z1]]},
     {k:depth(x+a,z),col:side,p:[[x1,y,z],[x1,y,z1],[x1,y1,z1],[x1,y1,z]]},
     {k:depth(x,z+d),col:side,p:[[x,y,z],[x,y,z1],[x,y1,z1],[x,y1,z]]},
     {k:depth(x+a,z),col:front,p:[[x,y,z],[x1,y,z],[x1,y1,z],[x,y1,z]]}
    ];
    faces.sort((l,r)=>l.k-r.k);
    for(const f of faces.slice(-2))poly(f.p,f.col);
    poly([[x,y1,z],[x1,y1,z],[x1,y1,z1],[x,y1,z1]],top);
   }
   let tiles=[];for(let z=0;z<20;z++)for(let x=0;x<20;x++)
    tiles.push({x,z,order:depth(x+.5,z+.5)});
   tiles.sort((a,b)=>a.order-b.order);
   for(const t of tiles){let alt=(t.x*7+t.z*11)%9;
    poly([[t.x,-.06,t.z],[t.x+1,-.06,t.z],[t.x+1,-.06,t.z+1],[t.x,-.06,t.z+1]],
     alt<3?"#436d40":alt<6?"#486f44":"#497548");}
   let things=[];
   for(const t of s.forest)things.push({type:"tree",x:t.x,z:t.z,order:depth(t.x+.5,t.z+.5)});
   for(const t of s.bushes||[])things.push({type:"bush",x:t.x,z:t.z,berries:t.berries,order:depth(t.x+.5,t.z+.5)});
   for(const t of s.structures)things.push({type:"house",kind:t.type,x:t.x,z:t.z,order:depth(t.x+.5,t.z+.5)});
   for(const t of s.citizens)things.push({type:"citizen",x:t.x,z:t.z,actor:t,order:depth(t.x+.5,t.z+.5)});
   things.sort((a,b)=>a.order-b.order);
   for(const t of things){
    if(t.type==="tree"){
     cube(t.x+.35,0,t.z+.35,.3,.95,.3,"#835c39","#634728","#503a25");
     cube(t.x+.12,.9,t.z+.12,.76,1.15,.76,"#4b914a","#286c39","#23592d");
     cube(t.x+.23,2,t.z+.23,.54,.36,.54,"#68a05a","#358442","#2f7538");
    }else if(t.type==="bush"){
     cube(t.x+.28,0,t.z+.28,.48,.38,.48,"#3a8b42","#215a2a","#1b4824");
     if(t.berries>0)cube(t.x+.44,.32,t.z+.44,.18,.18,.18,"#dc6573","#a52f46","#84283e");
    }else if(t.type==="house"){
     const workshop=t.kind==="workshop",store=t.kind==="storehouse";
     const wide=store?1.95:workshop?1.8:1.6;
     const walls=workshop?["#929ba2","#687986","#52616e"]:store?["#bfaa76","#998356","#756241"]:["#b99a62","#94734b","#795b3e"];
     const roof=workshop?["#638cb0","#426888","#2e526d"]:store?["#95895b","#756a48","#5b513a"]:["#b75b49","#964638","#77392f"];
     cube(t.x-.25,0,t.z-.15,wide,1.35,1.5,...walls);
     cube(t.x-.39,1.35,t.z-.28,wide+.26,.5,1.76,...roof);
     if(workshop)cube(t.x+1.05,1.75,t.z+.12,.29,.82,.30,"#777a78","#555c5c","#444b49");
     if(store)cube(t.x+.85,.15,t.z+1.36,.38,.42,.06,"#e8cc78","#b99b4f","#937742");
    }else{
     let colors=t.actor.id==="sim_aria"?["#88c0ff","#507fc3","#3968a4"]:
       t.actor.homeId==="village_02"?["#8be0c9","#42b7a5","#288979"]:
       t.actor.id==="sim_bran"?["#f8d785","#c09542","#a87a33"]:["#f0b4d5","#c474a2","#984e7e"];
     cube(t.x+.29,0,t.z+.29,.42,.88,.42,...colors);
     cube(t.x+.25,.88,t.z+.25,.5,.38,.5,"#e9bb8b","#b98a66","#9a6e52");
    }
   }
  }
  return Object.freeze({render,rotate,zoom,mode:"canvas-2d-fallback"});
 }
 return Object.freeze({create});
});
</script>
<script>/* GODSEED V3 proof controls: deterministic simulation tick, read-only render, isolated storage. */
(function(root){"use strict";
  const useSociety=/(?:^|[?&])mode=society(?:&|$)/.test(root.location.search||"");
  const Sim=useSociety?root.GodseedV3Society:root.GodseedV3Sim;
  const View=root.GodseedV3View,Fallback=root.GodseedV3Fallback;
  if(!Sim||!View||!Fallback)throw new Error("GODSEED V3 modules missing");
  const el=id=>document.getElementById(id);
  let canvas=el("scene");
  let simulation,view=null,rendererMode="unavailable",paused=false,speed=1,last=0,acc=0,dirty=true;
  let lastPersistedTick=-1,lastShownTick=-1,lastDraw=0,status="";
  function setStatus(message){status=message;el("headline").textContent=message;}
  function seedNow(){return ((Date.now()>>>0)^0x5a17b913)>>>0;}
  function newWorld(seed){
    simulation=Sim.create(seed===undefined?seedNow():seed);
    paused=false;acc=0;last=0;lastPersistedTick=-1;lastShownTick=-1;dirty=true;
    el("pause").setAttribute("aria-pressed","false");
    el("pause").textContent="Pausar";
    setStatus(useSociety?"Sociedad autónoma · fabricación y elecciones":"Nuevo mundo autónomo · sin comandos a los Sims");
    update();
    return simulation.snapshot();
  }
  function save(){
    if(!simulation)return false;
    try{
      root.localStorage.setItem(Sim.STORAGE_KEY,simulation.serialize());
      lastPersistedTick=simulation.snapshot().tick;
      setStatus("Mundo guardado localmente · V3 independiente");
      return true;
    }catch(error){
      setStatus("No se pudo guardar: almacenamiento local no disponible");
      return false;
    }
  }
  function load(){
    try{
      const raw=root.localStorage.getItem(Sim.STORAGE_KEY);
      if(!raw)return false;
      const loaded=Sim.restore(raw);simulation=loaded;
      paused=true;acc=0;last=0;dirty=true;
      lastPersistedTick=simulation.snapshot().tick;lastShownTick=-1;
      el("pause").setAttribute("aria-pressed","true");
      el("pause").textContent="Continuar";
      setStatus("Partida V3 recuperada y pausada");
      update();
      return true;
    }catch(error){
      setStatus("Guardado V3 inválido; sin borrar ni tocar partidas antiguas");
      return "invalid";
    }
  }
  function togglePause(){
    paused=!paused;acc=0;last=0;
    el("pause").setAttribute("aria-pressed",String(paused));
    el("pause").textContent=paused?"Continuar":"Pausar";
    setStatus(paused?"Simulación pausada":"Mundo autónomo en marcha");
    return paused;
  }
  function step(){
    if(!paused)togglePause();
    const result=simulation.advance(1);
    dirty=true;update();
    return result;
  }
  function statsPair(parent,label,value){
    const dt=document.createElement("dt"),dd=document.createElement("dd");
    dt.textContent=label;dd.textContent=String(value);
    parent.appendChild(dt);parent.appendChild(dd);
  }
  function update(){
    if(!simulation)return;
    const state=simulation.snapshot();
    if(lastShownTick!==state.tick){
      const stats=el("stats");stats.textContent="";
      statsPair(stats,"Semilla",state.seed);
      statsPair(stats,"Ciclo",state.tick);
      statsPair(stats,"Habitantes",state.citizens.length);
      statsPair(stats,"Madera disponible",state.wood);
      statsPair(stats,"Madera recolectada",state.harvested);
      statsPair(stats,"Madera gastada",useSociety?state.spentWood:state.spent);
      statsPair(stats,useSociety?"Edificios terminados":"Refugios construidos",state.structures.length);
      if(useSociety){
        statsPair(stats,"Herramientas",state.axe);
        statsPair(stats,"Kits fabricados",state.kitsCrafted);
        statsPair(stats,"Líder",state.settlement.leaderId||"Sin elegir");
        statsPair(stats,"Elecciones",state.settlement.elections);
        statsPair(stats,"Prioridad del consejo",state.settlement.policy||"none");
        statsPair(stats,"Repartos de oficio",state.settlement.ordersIssued||0);
        statsPair(stats,"Comunidades",state.outpost.status==="established"?2:1);
        statsPair(stats,"Puesto oriental",state.outpost.status);
        statsPair(stats,"Reservas orientales",state.outpost.wood+" madera / "+state.outpost.food+" comida");
        statsPair(stats,"Entregas completadas",state.outpost.deliveries);
      }
      statsPair(stats,"Comida disponible",state.food);
      statsPair(stats,"Bayas recolectadas",state.foodGathered);
      statsPair(stats,"Raciones consumidas",state.foodEaten);
      const people=el("citizens");people.textContent="";
      for(const c of state.citizens){
        const div=document.createElement("div");div.className="person";
        const title=document.createElement("strong");title.textContent=c.name+" · "+c.trait;
        const desc=document.createElement("div");
        if(c.mind){
          const mind=c.mind;
          desc.textContent="Objetivo: "+c.goal+
            " | Salud "+c.health+"/100 | Hambre "+c.hunger+"/100 | Energía "+c.energy+"/20"+
            " | Ánimo "+mind.emotions.contentment+"/100 | Estrés "+mind.emotions.stress+"/100"+
            " | Curiosidad "+mind.personality.curiosity+"/100 | Prudencia "+mind.personality.caution+"/100"+
            " | Experiencia recolectando "+mind.skills.foraging+"/100"+
            " | Lugares conocidos "+mind.visited.length+" | Recuerdos "+mind.memories.length;
        }else{
          desc.textContent="Objetivo: "+c.goal+" | Salud "+c.health+"/100 | Hambre "+c.hunger+
            "/100 | Energía "+c.energy+"/20 | Fabricaciones "+c.crafted+
            " | Construcciones "+c.built+" | Conversaciones "+c.conversations+
            " | Oficio "+c.role+" | Tareas de oficio "+c.ordersCompleted+
            " | Comunidad "+c.homeId+
            " | Comida recolectada "+c.foraged+" | Recuerdos "+c.memories.length+
            (state.settlement.leaderId===c.id?" | Líder elegido":"");
        }
        div.appendChild(title);div.appendChild(desc);people.appendChild(div);
      }
      const events=el("events");events.textContent="";
      const memoryPanel=el("memories");memoryPanel.textContent="";
      if(useSociety){
        el("memories").previousElementSibling.textContent="Consejo de la aldea";
        const council=state.settlement;
        const div=document.createElement("div");
        div.textContent="Líder: "+(council.leaderId||"ninguno")+
          " | Votos: "+council.ballots.map(b=>b.voter+" → "+b.candidate).join(", ");
        memoryPanel.appendChild(div);
        const policy=document.createElement("div");
        policy.textContent="Prioridad: "+council.policy+" | Evidencia: "+council.policyReason;
        memoryPanel.appendChild(policy);
        for(const person of state.citizens){
          const note=document.createElement("div");
          const latest=person.memories.length?person.memories[person.memories.length-1]:null;
          note.textContent=person.name+" · "+person.role+" · "+person.ordersCompleted+
            " tareas · recuerdo: "+(latest?latest.kind+" (ciclo "+latest.tick+")":"sin recuerdos");
          memoryPanel.appendChild(note);
        }
      }else{
        const mind=state.citizens[0].mind;
        const memoryLabels={build:"Su primer refugio",forage:"Encontró comida",
          eat:"Su primera comida",discover:"Descubrió un lugar",
          reflect:"Pensó en su hogar",hardship:"Pasó hambre"};
        for(const entry of mind.memories.slice(-4).reverse()){
          const div=document.createElement("div");
          div.textContent="Ciclo "+entry.tick+" · "+(memoryLabels[entry.kind]||entry.kind);
          memoryPanel.appendChild(div);
        }
      }
      for(const e of state.events.slice(-6).reverse()){
        const div=document.createElement("div");
        const labels={build:"construyó edificio",harvest:"recolectó madera",
          forage:"recolectó bayas",eat:"comió",rest:"descansó",
          discover:"descubrió un lugar",reflect:"reflexionó",hardship:"pasó hambre",
          craft:"fabricó "+(e.details.recipe||"objeto"),
          talk:"conversó con "+(e.details.with||"otro habitante"),
          arrive:"llegó a la aldea",elect:"fue elegido líder",death:"falleció",
          assign:"recibió oficio "+(e.details.role||""),
          council:"decidió priorizar "+(e.details.policy||""),
          approve_outpost:"aprobó fundación de otra comunidad",
          found_outpost:"fundó Colina Oriental",
          dispatch:"despachó provisiones",deliver:"entregó alimentos"};
        div.textContent="Ciclo "+e.tick+" · "+e.actor+": "+(labels[e.action]||e.action)+
          (e.action==="build"&&e.details.site?" ("+e.details.site+")":"");
        events.appendChild(div);
      }
      lastShownTick=state.tick;
    }
    if(view){
      const factor=Math.min(root.devicePixelRatio||1,1.25);
      const w=Math.max(1,Math.floor(canvas.clientWidth*factor));
      const h=Math.max(1,Math.floor(canvas.clientHeight*factor));
      if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;dirty=true;}
      if(dirty){view.render(state);dirty=false;}
    }
  }
  function loop(now){
    if(!last)last=now;
    const elapsed=Math.max(0,Math.min(250,now-last));last=now;
    if(!paused&&simulation){
      acc+=elapsed*speed;
      const steps=Math.min(18,Math.floor(acc/450));
      if(steps){
        acc-=steps*450;simulation.advance(steps);dirty=true;
        const tick=simulation.snapshot().tick;
        if(tick-lastPersistedTick>=35)save();
      }
    }
    if(dirty||now-lastDraw>450){update();lastDraw=now;}
    root.requestAnimationFrame(loop);
  }
  function controls(){
    el("pause").addEventListener("click",togglePause);
    el("step").addEventListener("click",step);
    el("speed").addEventListener("click",function(){
      speed=speed===1?4:speed===4?12:1;el("speed").textContent="Velocidad ×"+speed;
    });
    el("zoomIn").addEventListener("click",()=>{if(view){view.zoom(-3);dirty=true;}});
    el("zoomOut").addEventListener("click",()=>{if(view){view.zoom(3);dirty=true;}});
    el("save").addEventListener("click",save);
    el("mode").textContent=useSociety?"Modo Aria sola":"Modo sociedad";
    el("mode").addEventListener("click",function(){
      // Switching simulations reloads the page and never touches the other save key.
      save();
      root.location.search=useSociety?"mode=solo":"mode=society";
    });
    el("reset").addEventListener("click",function(){
      try{root.localStorage.removeItem(Sim.STORAGE_KEY);}catch(error){}
      newWorld();
    });
    let lastPointer=null;
    canvas.addEventListener("pointerdown",function(e){
      lastPointer={id:e.pointerId,x:e.clientX,y:e.clientY};
      try{canvas.setPointerCapture(e.pointerId);}catch(error){}
    });
    canvas.addEventListener("pointermove",function(e){
      if(!lastPointer||lastPointer.id!==e.pointerId||!view)return;
      view.rotate((e.clientX-lastPointer.x)/Math.max(100,canvas.clientWidth),
        (e.clientY-lastPointer.y)/Math.max(100,canvas.clientHeight));
      lastPointer.x=e.clientX;lastPointer.y=e.clientY;dirty=true;
    });
    for(const type of ["pointerup","pointercancel","lostpointercapture"])
      canvas.addEventListener(type,()=>{lastPointer=null;});
    canvas.addEventListener("wheel",function(e){e.preventDefault();if(view){view.zoom(Math.sign(e.deltaY)*2);dirty=true;}},{passive:false});
    root.addEventListener("pagehide",save);
    document.addEventListener("visibilitychange",function(){
      if(document.hidden){if(!paused)togglePause();save();}
    });
    root.addEventListener("keydown",function(e){
      if(e.code==="Space"){e.preventDefault();togglePause();}
      if(view&&e.key==="ArrowLeft"){view.rotate(-.12,0);dirty=true;}
      if(view&&e.key==="ArrowRight"){view.rotate(.12,0);dirty=true;}
    });
  }
  const forceFallback=Boolean(root.location&&((root.location.search||"").indexOf("renderer=2d")>=0));
  try{
    if(forceFallback)throw new Error("Canvas2D QA");
    view=View.create(canvas);rendererMode="webgl-3d";
  }catch(error){
    // After a partial shader initialization a WebGL canvas cannot become 2D.
    // Replace canvas before binding movement and creating the fallback context.
    const replacement=canvas.cloneNode(false);
    canvas.parentNode.replaceChild(replacement,canvas);
    canvas=replacement;
    try{
      view=Fallback.create(canvas);rendererMode="canvas-2d-fallback";
    }catch(fallbackError){
      const warning=el("warning");warning.style.display="block";
      warning.textContent="WebGL y Canvas2D no están disponibles; la simulación continúa sin imagen.";
    }
  }
  controls();
  // Invalid saves remain on disk untouched until the player explicitly resets.
  if(load()===false)newWorld(14);
  if(rendererMode==="canvas-2d-fallback")setStatus("Modo compatible 2.5D · WebGL no disponible");
  // Public test/inspection interface; never exposes a writable simulation object.
  root.GodseedV3Debug=Object.freeze({
    getState:()=>simulation.snapshot(),newWorld,step,save,load,
    fastForward:(n)=>{
      if(!paused)togglePause();
      const result=simulation.advance(n);dirty=true;update();return result;
    },
    isPaused:()=>paused,pause:()=>{if(!paused)togglePause();return true;},
    resume:()=>{if(paused)togglePause();return true;},
    hasWebGL:()=>rendererMode==="webgl-3d",rendererMode:()=>rendererMode,storageKey:Sim.STORAGE_KEY,
    mode:()=>useSociety?"society":"solo"
  });
  root.requestAnimationFrame(loop);
})(typeof window!=="undefined"?window:globalThis);
</script>
