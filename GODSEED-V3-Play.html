<body>

<script>/* GODSEED V3 opt-in autonomous simulation. Existing v1 saves are untouched. */
(function(root,factory){"use strict";const api=factory();
  if(typeof module!=="undefined"&&module.exports)module.exports=api;
  if(root)root.GodseedV3Sim=api;
})(typeof globalThis!=="undefined"?globalThis:this,function(){"use strict";
  const VERSION=3,SIZE=20,STORAGE_KEY="godseed-v3-prototype-v1";
  const copy=x=>JSON.parse(JSON.stringify(x));
  const pos=(x,z)=>Number.isSafeInteger(x)&&Number.isSafeInteger(z)&&x>=0&&z>=0&&x<SIZE&&z<SIZE;
  const uint32=x=>Number.isSafeInteger(x)&&x>=0&&x<=0xffffffff;
  const distance=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.z-b.z);
  function forestFor(seed){
    const found=[];
    for(let z=1;z<SIZE-1;z++)for(let x=1;x<SIZE-1;x++){
      if(x>=3&&x<=7&&z>=3&&z<=6)continue;
      const h=Math.imul(x+11,73856093)^Math.imul(z+17,19349663)^Math.imul(seed+1,83492791);
      if((h>>>0)%11<2)found.push({x,z});
    }
    for(const p of [{x:3,z:8},{x:8,z:6},{x:9,z:8},{x:5,z:10},{x:11,z:5},{x:7,z:11}]){
      if(!found.some(q=>q.x===p.x&&q.z===p.z))found.push(p);
    }
    return found.sort((a,b)=>a.z-b.z||a.x-b.x);
  }
  // Seed-derived personality; observable, bounded cognition with no external AI services.
  const clamp=x=>Math.max(0,Math.min(100,x));
  const LANDMARKS=[{x:2,z:2},{x:10,z:4},{x:11,z:9},{x:6,z:12},
    {x:3,z:11},{x:13,z:5},{x:10,z:14},{x:14,z:13}];
  const remembered=new Set(["forage","eat","build","discover","reflect","hardship"]);
  function makeMind(seed,c,s){
    return {personality:{
      curiosity:40+(seed%41),
      caution:30+((seed>>>7)%51)
    },emotions:{contentment:55,stress:10},
    skills:{foraging:Math.min(100,s.foodGathered*2),woodworking:Math.min(100,c.harvested*8)},
    memories:[],visited:[c.z*SIZE+c.x],reflections:0};
  }
  function memory(s,c,action,details){
    if(!c.mind||!remembered.has(action))return;
    const m=c.mind.memories;
    // First meal/forage and construction are durable milestones, not spam.
    if((action==="eat"||action==="forage")&&m.some(v=>v.kind===action))return;
    if(action==="reflect"&&s.tick%30!==0)return;
    const entry={tick:s.tick,kind:action,x:c.x,z:c.z,
      valence:action==="hardship"?-2:action==="build"?2:1};
    if(action==="discover"&&details&&pos(details.x,details.z)){
      entry.x=details.x;entry.z=details.z;
    }
    if(m.length>=20){
      const index=m.findIndex(v=>v.kind!=="build"&&v.kind!=="eat"&&v.kind!=="forage");
      m.splice(index<0?0:index,1);
    }
    m.push(entry);
  }
  function visit(c){
    const key=c.z*SIZE+c.x;
    if(!c.mind.visited.includes(key))c.mind.visited.push(key);
  }
  function explore(s,c){
    const m=c.mind;
    if(m.personality.curiosity<46||m.emotions.stress>=28||
      c.hunger<72||c.energy<9)return false;
    const points=LANDMARKS;
    // Choosing a new landmark depends on remembered visited cells.
    const next=points.find(p=>!m.visited.includes(p.z*SIZE+p.x));
    if(!next)return false;
    walk(c,next);
    c.goal="explorar terreno";
    visit(c);
    if(c.x===next.x&&c.z===next.z)
      record(s,c,"discover",{x:next.x,z:next.z});
    return true;
  }

  function record(s,c,action,details){
    s.events.push({tick:s.tick,actor:c.id,action,details});
    if(s.events.length>48)s.events.shift();
    if(c.mind){
      const mood=c.mind.emotions;
      const effects={harvest:[1,0],forage:[2,-2],eat:[5,-5],
        build:[20,-15],rest:[1,-3],discover:[6,-3],
        reflect:[3,-10],hardship:[-8,9]};
      const delta=effects[action];
      if(delta){
        mood.contentment=clamp(mood.contentment+delta[0]);
        mood.stress=clamp(mood.stress+delta[1]);
      }
      memory(s,c,action,details);
    }
  }
  function nearestTree(c,forest){
    let best=null,score=Infinity;
    for(const t of forest){
      const bias=c.trait==="explorer"?Math.abs(t.z-10)/12:Math.abs(t.x-7)/12;
      const next=distance(c,t)+bias;
      if(next<score){score=next;best=t;}
    }
    return best;
  }
  // Four renewable patches inside the treeless village clearing; no randomness per tick.
  const GROVE=[{x:3,z:4},{x:4,z:6},{x:6,z:4},{x:7,z:6}];
  function groveFor(){return GROVE.map(p=>({x:p.x,z:p.z,berries:3}));}
  function nearestBush(c,bushes){
    let best=null,dist=Infinity;
    for(const b of bushes)if(b.berries>0){
      const d=distance(c,b);
      if(d<dist){dist=d;best=b;}
    }
    return best;
  }
  function walk(c,target){
    if(c.x!==target.x)c.x+=Math.sign(target.x-c.x);
    else c.z+=Math.sign(target.z-c.z);
    c.energy=Math.max(0,c.energy-1);
  }
  function act(s,c){
    if(!c.alive){c.goal="sin vida";return;}
    if(c.hunger<=60&&s.food>0){
      s.food--;s.foodEaten++;c.hunger=Math.min(100,c.hunger+38);
      c.goal="comer";record(s,c,"eat",{foodSpent:1});return;
    }
    if(c.energy<5&&!(c.hunger<20&&s.food===0)){
      c.energy=Math.min(20,c.energy+8);c.goal="descansar";
      record(s,c,"rest",{energy:c.energy});return;
    }
    // Food takes priority over building and wood reserves.
    const foodTarget=2+Math.floor(c.mind.personality.caution/24);
    if(s.food<foodTarget||c.hunger<=60){
      const bush=nearestBush(c,s.bushes);
      if(bush){
        if(distance(c,bush)<=1){
          bush.berries--;s.food++;s.foodGathered++;
          c.energy=Math.max(0,c.energy-(c.mind.skills.foraging>=30?1:2));
          c.mind.skills.foraging=Math.min(100,c.mind.skills.foraging+2);
          c.goal="recolectar bayas";
          record(s,c,"forage",{x:bush.x,z:bush.z,foodProduced:1});
        }else{walk(c,bush);c.goal="buscar alimento";}
        return;
      }
      if(c.hunger<=60){
        c.energy=Math.min(20,c.energy+1);c.goal="esperar frutos";return;
      }
    }
    if(!s.structures.length&&s.wood>=4){
      s.wood-=4;s.spent+=4;s.structures.push({id:"first_shelter",type:"house",x:5,z:5});
      c.energy=Math.max(0,c.energy-2);c.goal="construir refugio";
      record(s,c,"build",{id:"first_shelter",woodSpent:4});return;
    }
    if(!s.structures.length||s.wood<4){
      const tree=nearestTree(c,s.forest);
      if(tree){
        if(distance(c,tree)<=1){
          const i=s.forest.findIndex(t=>t.x===tree.x&&t.z===tree.z);
          if(i<0)throw new Error("resource ownership conflict");
          s.forest.splice(i,1);s.wood++;s.harvested++;c.harvested++;
          c.energy=Math.max(0,c.energy-(c.mind.skills.woodworking>=32?2:3));
          c.mind.skills.woodworking=Math.min(100,c.mind.skills.woodworking+8);
          c.goal="recolectar madera";
          record(s,c,"harvest",{x:tree.x,z:tree.z,woodProduced:1});
        }else{walk(c,tree);c.goal="caminar hacia recurso";}
        return;
      }
      c.goal="sin madera";c.energy=Math.min(20,c.energy+1);return;
    }
    const home=s.structures[0];
    if(c.mind.emotions.stress>=28){
      if(distance(c,home)>1){walk(c,home);c.goal="buscar seguridad";}
      else{
        c.energy=Math.min(20,c.energy+3);c.mind.reflections++;
        c.goal="reflexionar en refugio";
        record(s,c,"reflect",{relief:10});
      }
      return;
    }
    if(explore(s,c))return;
    if(distance(c,home)>1){walk(c,home);c.goal="regresar al refugio";}
    else{c.energy=Math.min(20,c.energy+2);c.goal="cuidar refugio";}
  }
  function validateLegacy(s){
    if(!s||typeof s!=="object"||Array.isArray(s)||s.schemaVersion!==1||
      !uint32(s.seed)||!Number.isSafeInteger(s.tick)||s.tick<0||
      !Array.isArray(s.citizens)||s.citizens.length!==2||
      !Array.isArray(s.forest)||!Array.isArray(s.structures)||s.structures.length>1||
      !Array.isArray(s.events)||s.events.length>48||
      !Number.isSafeInteger(s.wood)||s.wood<0||
      !Number.isSafeInteger(s.harvested)||s.harvested<0||
      !Number.isSafeInteger(s.spent)||s.spent<0||s.wood!==s.harvested-s.spent)return false;
    const original=forestFor(s.seed),keys=new Set();
    if(s.harvested+s.forest.length!==original.length)return false;
    for(const t of s.forest){
      if(!t||!pos(t.x,t.z)||!original.some(p=>p.x===t.x&&p.z===t.z))return false;
      const key=t.x+","+t.z;if(keys.has(key))return false;keys.add(key);
    }
    const expected=[["sim_aria","explorer"],["sim_bran","builder"]];
    for(let i=0;i<2;i++){
      const c=s.citizens[i];
      if(!c||c.id!==expected[i][0]||c.trait!==expected[i][1]||
        !pos(c.x,c.z)||!Number.isInteger(c.energy)||c.energy<0||c.energy>20||
        !Number.isSafeInteger(c.harvested)||c.harvested<0||
        typeof c.goal!=="string"||c.goal.length>80)return false;
    }
    if(s.citizens[0].harvested+s.citizens[1].harvested!==s.harvested)return false;
    if(s.structures.length){
      const b=s.structures[0];
      if(!b||b.id!=="first_shelter"||b.type!=="house"||b.x!==5||b.z!==5||s.spent!==4)return false;
    }else if(s.spent!==0)return false;
    for(const e of s.events){
      if(!e||!Number.isSafeInteger(e.tick)||e.tick<0||e.tick>s.tick||
        !expected.some(c=>c[0]===e.actor)||!["build","harvest"].includes(e.action))return false;
    }
    return true;
  }
  // Preserve the exact V2 validator to reject malformed saves before migration.
  function validateV2(s){
    if(!s||typeof s!=="object"||Array.isArray(s)||s.schemaVersion!==2||
       !uint32(s.seed)||!Number.isSafeInteger(s.tick)||s.tick<0||
       !Array.isArray(s.citizens)||s.citizens.length!==1||
       !Array.isArray(s.forest)||!Array.isArray(s.structures)||s.structures.length>1||
       !Array.isArray(s.bushes)||s.bushes.length!==GROVE.length||
       !Array.isArray(s.events)||s.events.length>48)return false;
    for(const key of ["wood","harvested","spent","legacyHarvested",
      "food","foodGathered","foodEaten","foodGrown"]){
      if(!Number.isSafeInteger(s[key])||s[key]<0)return false;
    }
    if(s.wood!==s.harvested-s.spent||s.food!==s.foodGathered-s.foodEaten)return false;
    const original=forestFor(s.seed),keys=new Set();
    if(s.harvested+s.forest.length!==original.length)return false;
    for(const t of s.forest){
      if(!t||!pos(t.x,t.z)||!original.some(p=>p.x===t.x&&p.z===t.z))return false;
      const key=t.x+","+t.z;if(keys.has(key))return false;keys.add(key);
    }
    const c=s.citizens[0];
    if(!c||c.id!=="sim_aria"||c.name!=="Aria"||c.trait!=="explorer"||
       !pos(c.x,c.z)||!Number.isInteger(c.energy)||c.energy<0||c.energy>20||
       !Number.isInteger(c.hunger)||c.hunger<0||c.hunger>100||
       !Number.isInteger(c.health)||c.health<0||c.health>100||
       typeof c.alive!=="boolean"||c.alive!==(c.health>0)||
       !Number.isSafeInteger(c.harvested)||c.harvested<0||
       c.harvested+s.legacyHarvested!==s.harvested||
       typeof c.goal!=="string"||c.goal.length>80)return false;
    let berries=0;
    for(let i=0;i<GROVE.length;i++){
      const b=s.bushes[i],p=GROVE[i];
      if(!b||b.x!==p.x||b.z!==p.z||!Number.isInteger(b.berries)||
         b.berries<0||b.berries>3)return false;
      berries+=b.berries;
    }
    if(s.foodGathered+berries!==GROVE.length*3+s.foodGrown)return false;
    if(s.structures.length){
      const b=s.structures[0];
      if(!b||b.id!=="first_shelter"||b.type!=="house"||
         b.x!==5||b.z!==5||s.spent!==4)return false;
    }else if(s.spent!==0)return false;
    for(const e of s.events){
      if(!e||!Number.isSafeInteger(e.tick)||e.tick<0||e.tick>s.tick||
        !["sim_aria","sim_bran"].includes(e.actor)||
        !["build","harvest","forage","eat","rest"].includes(e.action))return false;
    }
    return true;
  }
  function validate(s){
    if(!s||s.schemaVersion!==VERSION)return false;
    // Audit conserved resources, forest, food and one-citizen structure with
    // the established V2 validator; only the two new factual action types differ.
    if(!Array.isArray(s.events)||s.events.length>48)return false;
    if(!s.events.every(e=>e&&Number.isSafeInteger(e.tick)&&e.tick>=0&&
        e.tick<=s.tick&&["sim_aria","sim_bran"].includes(e.actor)&&
        ["build","harvest","forage","eat","rest","discover","reflect","hardship"].includes(e.action)))return false;
    const prior=Object.assign({},s,{schemaVersion:2,
      events:s.events.filter(e=>!["discover","reflect","hardship"].includes(e.action))});
    if(!validateV2(prior))return false;
    const c=s.citizens[0],m=c.mind;
    if(!m||typeof m!=="object"||Array.isArray(m)||
      !m.personality||!m.emotions||!m.skills||!Array.isArray(m.memories)||
      m.memories.length>20||!Array.isArray(m.visited)||m.visited.length>SIZE*SIZE||
      !Number.isSafeInteger(m.reflections)||m.reflections<0||m.reflections>s.tick)
      return false;
    for(const [o,keys] of [[m.personality,["curiosity","caution"]],
      [m.emotions,["contentment","stress"]],
      [m.skills,["foraging","woodworking"]]]){
      if(!o||typeof o!=="object"||keys.some(k=>!Number.isInteger(o[k])||o[k]<0||o[k]>100))
        return false;
    }
    const seen=new Set();
    for(const key of m.visited){
      if(!Number.isInteger(key)||key<0||key>=SIZE*SIZE||seen.has(key))return false;
      seen.add(key);
    }
    if(!seen.has(c.z*SIZE+c.x))return false;
    let last=-1;
    for(const note of m.memories){
      if(!note||!Number.isSafeInteger(note.tick)||note.tick<0||
        note.tick>s.tick||note.tick<last||!remembered.has(note.kind)||
        !pos(note.x,note.z)||!Number.isInteger(note.valence)||
        note.valence<-2||note.valence>2)return false;
      last=note.tick;
    }
    return true;
  }

  function instance(state){
    function snapshot(){return copy(state);}
    function advance(n){
      if(!Number.isSafeInteger(n)||n<0||n>20000)throw new RangeError("invalid steps");
      for(let i=0;i<n;i++){
        state.tick++;
        if(state.tick%15===0)for(const b of state.bushes){
          if(b.berries<3){b.berries++;state.foodGrown++;}
        }
        for(const c of state.citizens){
          if(!c.alive)continue;
          c.hunger=Math.max(0,c.hunger-1);
          if(c.hunger===0)c.health=Math.max(0,c.health-2);

<script>/* Autonomous two-community frontier extension for the isolated GODSEED V3 society.
 * Strictly bounded: one extra outpost, one founder, one courier. No RNG or network.
 * The parent simulation remains authoritative for clock, citizens and finite trees.

(function(root,factory){"use strict";const api=factory();

     !number(o.deliveries)||!number(o.shipmentsDispatched)||

     o.approvedAt!==null||o.foundedAt!==null||o.cargoWood||o.wood||
     o.food||o.delivery||o.deliveries||o.shipmentsDispatched||o.foodConsumed))return false;

     !number(o.approvedAt)||o.approvedAt>s.tick))return false;

<script>/* GODSEED V3: isolated, deterministic settlement prototype. No network or external AI. */

  if(typeof module!=="undefined"&&module.exports)module.exports=api;

})(typeof globalThis!=="undefined"?globalThis:this,function(){"use strict";
  const Frontier=typeof module!=="undefined"&&module.exports?
    require("./frontier.js"):globalThis.GodseedV3Frontier;
  if(!Frontier)throw Error("GODSEED frontier module missing");
  const VERSION=3,SIZE=20,STORAGE_KEY="godseed-v3-society-v1";
  const copy=x=>JSON.parse(JSON.stringify(x));
  const validPos=p=>p&&Number.isInteger(p.x)&&Number.isInteger(p.z)&&p.x>=0&&p.z>=0&&p.x<SIZE&&p.z<SIZE;
  const number=n=>Number.isSafeInteger(n)&&n>=0;
  const distance=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.z-b.z);
  const SITES=Object.freeze([{id:"home",type:"house",x:5,z:5,cost:4},
    {id:"workshop",type:"workshop",x:10,z:5,cost:6},
    {id:"storehouse",type:"storehouse",x:8,z:10,cost:4}]);
  const GROVE=Object.freeze([{x:3,z:4},{x:4,z:6},{x:6,z:4},{x:7,z:6}]);
  const PEOPLE=Object.freeze([
    {id:"sim_aria",name:"Aria",trait:"explorer",x:4,z:4,skill:2},
    {id:"sim_bran",name:"Bran",trait:"builder",x:16,z:15,skill:3},

    settled:template.id==="sim_aria",harvested:0,
    crafted:0,built:0,foraged:0,conversations:0,ordersCompleted:0,
    role:"unassigned",homeId:"village_01",memories:[],goal:"explorar",relations:{}};}

      const subject=details.with||details.site||details.recipe||details.role||
        details.policy||details.leader||details.settlement||null;
      remember(c,s.tick,action,subject);
    }

      record(s,tick,"eat",{foodSpent:1});return;
    }
    if(c.energy<4){c.energy=Math.min(20,c.energy+8);c.goal="descansar en el camino";return;}
    if(c.hunger<40&&c.food===0){gather(s,world,"food",tick);return;}

    // help an active local home, but never receives a forced construction job.
    // Historical itinerary saves keep their original behavior.
    const offer=c.routeMode==="free"&&c.stage!=="travel"?
      Projects.chooseVoluntaryWork(s.projects,c,s.social,tick,["home"],true):null;
    if(offer){
      const project=Projects.find(s.projects,offer.type,offer);
      const owner=s.settlers.find(person=>person.id===project.initiator);
      const homeCamp=owner?s.camps.find(b=>b.id===owner.homeCampId):null;
      if(owner&&owner.alive&&homeCamp&&owner.homeSite&&
         Nav.same(owner.homeSite,offer)&&!s.houses.length){
        if(offer.needsWood){
          gather(s,world,"wood",tick,true);
          c.goal="reunir madera para colaborar";
          return;
        }
        if(!Nav.same(c,offer)){
          const approach=Nav.local(world,c,offer,tick,16,2048);
          if(approach&&approach.path.length){
            move(s,approach.path[0]);
            c.goal="ofrecer ayuda a una obra cercana";
            return;
          }
        }else{
          const step=Projects.contribute(s.projects,project,c,tick);
          if(step.worked){
            s.woodSpent+=step.woodSpent;
            c.goal="ayudar por voluntad propia ("+project.progress+"/"+project.required+")";
            record(s,tick,"assist_work_home",{x:offer.x,z:offer.z,
              progress:project.progress,woodSpent:step.woodSpent,for:owner.id});
            if(step.completed)completeFrontierHome(s,homeCamp,owner,project,tick,c.id);

      const target=c.routeMode==="free"?c.target:ROUTE[c.routeIndex];
      if(!target){c.stage="supply";return;}
      if(Nav.same(c,target)){arrive(s,world,tick);return;}
      // Both region centers lie on the same continuous ancient road lattice.
      const step=Nav.roadStep(world,c,target);
      if(step){move(s,step);c.goal="viajar a región "+(c.routeIndex+1);}
      else{c.stage="return";c.goal="volver a camino seguro";}
      return;

    const needsCamp=c.routeMode==="free"?
      (c.routeIndex>0&&s.camps.length<CAMP_LIMIT&&
       !s.camps.some(b=>b.anchorX===c.anchor.x&&b.anchorZ===c.anchor.z)&&
       (s.camps.length===0||Math.min(...s.camps.map(b=>
         Nav.distance({x:b.anchorX,z:b.anchorZ},c.anchor)))>=160)):
      (c.routeIndex>0&&(c.routeIndex-1)%4===0&&s.camps.length<CAMP_LIMIT&&
       !s.camps.some(b=>b.anchorX===c.anchor.x&&b.anchorZ===c.anchor.z));
    if(c.food<4){gather(s,world,"food",tick);return;}
    if(needsCamp){
      const site=c.routeMode==="free"?
        (c.campSite||(c.campSite=Infra.chooseHomeSite(world,c.anchor,c.mind.preferences,tick))):
        {x:c.anchor.x+2,z:c.anchor.z+2};
      if(!site){c.goal="buscar un sitio viable para refugio";return;}
      // Migrated travelers preserve their historical waypoint and site choices;
      // future construction still uses real, auditable work shifts.
      const current=Projects.find(s.projects,"camp",site);
      if(c.wood<(current?1:4)){gather(s,world,"wood",tick,true);return;}
      if(!goLocal(s,world,site,tick)){
        c.goal="transportar madera al refugio";return;
      }
      const task=Projects.propose(s.projects,"camp",site,c.id,tick);
      if(!task){c.goal="esperar acceso al proyecto";return;}
      const step=Projects.contribute(s.projects,task,c,tick);
      if(!step.worked){c.goal="obtener provisiones para construir";return;}
      s.woodSpent+=step.woodSpent;
      c.goal="construir refugio ("+task.progress+"/"+task.required+")";
      if(step.completed){
        const camp={id:"camp_"+c.routeIndex,type:"camp",x:site.x,z:site.z,
          anchorX:c.anchor.x,anchorZ:c.anchor.z,builder:c.id,completedAt:tick,
          name:"Refugio de ruta "+(s.camps.length+1)};
        s.camps.push(camp);c.campSite=null;
        c.goal="terminé mi refugio";

      if(c.routeIndex>=ROUTE.length){
        c.goal="cuidar el último campamento";c.energy=Math.min(20,c.energy+2);return;
      }

      const choice=Discovery.select(world,c,s.discoveries);
      if(!choice){
        c.goal="exploración conocida, buscar nuevas actividades";
        c.energy=Math.min(20,c.energy+2);return;
      }
      c.target=choice;
      Agency.commitChoice(c.mind,"explore");

  function validate(s,world,tick,removedCount){

      !Array.isArray(s.settlers)||s.settlers.length>1||
      !Array.isArray(s.houses)||s.houses.length>1||
      !Array.isArray(s.roads)||s.roads.length>Infra.MAX_LOCAL_ROAD||
      !Array.isArray(s.discoveries)||s.discoveries.length>Discovery.MAX_DISCOVERIES||
      !Array.isArray(s.events)||s.events.length>EVENT_LIMIT||
      !Array.isArray(s.knownChunks)||s.knownChunks.length>4096||
      !Social.validate(s.social,s.explorer,s.settlers,tick))return false;
    for(const k of ["woodGathered","woodSpent","foodGathered","foodEaten",
      "settlerWoodGathered","settlerFoodGathered","settlerFoodEaten"])
      if(!positive(s[k]))return false;

      [s.explorer,...s.settlers].filter(Boolean),s.camps);
    if(projectUnits===false)return false;
    const pending=s.projects.entries.filter(p=>p.status==="active")
      .reduce((n,p)=>n+p.progress,0);
    const pendingCamp=s.projects.entries.filter(p=>p.status==="active"&&
      p.type==="camp").reduce((n,p)=>n+p.progress,0);

    const settlerCampWork=paidBy("world_mira",true);

      if(!first||m.id!=="world_mira"||m.name!=="Mira"||
        m.trait!=="colona"||m.worldSettler!==true||
        m.homeCampId!==first.id||!positive(m.bornAt)||
        m.bornAt<first.completedAt||m.bornAt>tick||
        !world.walkable(m.x,m.z)||!m.homeSite||
        !world.walkable(m.homeSite.x,m.homeSite.z)||
        Nav.distance(m.homeSite,first)<2||Nav.distance(m.homeSite,first)>12||
        !Agency.validate(m.mind,tick)||typeof m.goal!=="string"||
        m.goal.length>80)return false;
      for(const k of ["energy","hunger","health","food","wood"])
        if(!positive(m[k]))return false;
      if(m.energy>20||m.hunger>100||m.health>100||
        m.alive!==(m.health>0)||
        m.wood!==s.settlerWoodGathered-s.houses.length*4-s.roads.length-
           pendingSettler+travelerCivicWork-settlerCampWork||
        m.food!==s.settlerFoodGathered-s.settlerFoodEaten)return false;
    }
    if(s.houses.length){
      const h=s.houses[0];
      if(!m||!h||h.id!=="frontier_home_1"||h.type!=="home"||
        h.x!==m.homeSite.x||h.z!==m.homeSite.z||
        h.campId!==first.id||h.builder!==m.id||
        h.name!=="Casa de Mira"||!positive(h.completedAt)||
        h.completedAt<m.bornAt||h.completedAt>tick)return false;
    }
    if(s.roads.length&&!s.houses.length)return false;
    if(!Infra.validate(world,s.camps.filter(b=>m&&b.id===m.homeCampId).concat(s.houses),s.roads,tick,
      m?m.id:null,m?m.bornAt:0))return false;

    for(const id of s.knownChunks){
      if(typeof id!=="string"||!/^(-?\d+),(-?\d+)$/.test(id)||chunks.has(id))return false;
      const p=id.split(",").map(Number);
      if(p.some(v=>v< -32||v>31)||id!==p[0]+","+p[1])return false;chunks.add(id);
    }
    const c=s.explorer;
    if(c===null)return !s.camps.length&&!s.discoveries.length&&!s.events.length&&
      !s.settlers.length&&!s.houses.length&&!s.roads.length&&
      !s.knownChunks.length&&!s.woodGathered&&!s.woodSpent&&!s.foodGathered&&!s.foodEaten;
    if(!c||c.id!=="world_taren"||c.name!=="Taren"||c.trait!=="cartógrafo"||c.worldExplorer!==true||
      !positive(c.bornAt)||c.bornAt<600||c.bornAt>tick||!world.walkable(c.x,c.z)||
      !c.anchor||!Number.isInteger(c.anchor.x)||!Number.isInteger(c.anchor.z)||
      c.anchor.x< -488||c.anchor.x>472||c.anchor.z< -488||c.anchor.z>472||
      (c.anchor.x-24)%64!==0||(c.anchor.z-24)%64!==0||
      (c.campSite!==null&&
        (!c.campSite||!Number.isSafeInteger(c.campSite.x)||
         !Number.isSafeInteger(c.campSite.z)||
         !world.walkable(c.campSite.x,c.campSite.z)||
         Nav.distance(c.campSite,c.anchor)>12))||
      !positive(c.routeIndex)||c.routeIndex>(c.routeMode==="free"?
        Discovery.MAX_DISCOVERIES:ROUTE.length)||
      !["free","legacy"].includes(c.routeMode)||
      (c.routeMode==="free"?
        (!Agency.validate(c.mind,tick)||!Discovery.validTarget(world,c.target,s.discoveries)||
         (c.stage==="travel"&&!c.target)):
        (c.mind!==null||c.target!==null))||
      !["supply","return","travel"].includes(c.stage)||
      typeof c.goal!=="string"||c.goal.length>80)return false;
    for(const k of ["energy","hunger","health","food","wood"])if(!positive(c[k]))return false;
    if(c.energy>20||c.hunger>100||c.health>100||c.alive!==(c.health>0)||
      c.wood!==s.woodGathered-s.settlerWoodGathered-s.camps.length*4-pendingCamp-
         travelerCivicWork+settlerCampWork||
      c.food!==s.foodGathered-s.settlerFoodGathered-(s.foodEaten-s.settlerFoodEaten)||
      s.discoveries.length!==c.routeIndex||
      !chunks.has(Math.floor(c.x/16)+","+Math.floor(c.z/16))||
      (m&&!chunks.has(Math.floor(m.x/16)+","+Math.floor(m.z/16))))return false;
    const expected=c.routeIndex?(c.routeMode==="free"?
      s.discoveries[c.routeIndex-1]:ROUTE[c.routeIndex-1]):{x:24,z:24};
    if(!Nav.same(c.anchor,expected))return false;
    let previous=-1;
    for(let i=0;i<s.discoveries.length;i++){
      const d=s.discoveries[i],p=c.routeMode==="free"?d:ROUTE[i],
        landmark=world.landmark(Math.floor(p.x/64),Math.floor(p.z/64));
      if(!d||!landmark||d.id!==landmark.id||d.name!==landmark.name||d.type!==landmark.type||
        !Nav.same(d,landmark)||!positive(d.tick)||d.tick<c.bornAt||d.tick>tick||d.tick<previous)return false;
      previous=d.tick;
    }
    if(c.routeMode==="free"&&
      !Discovery.validateHistory(world,s.discoveries,c.bornAt,tick))return false;
    const ids=new Set();previous=-1;
    for(const camp of s.camps){
      const position=s.camps.indexOf(camp);
      const index=c.routeMode==="free"?
        s.discoveries.findIndex(d=>d.x===camp.anchorX&&d.z===camp.anchorZ):
        position*4;
      const d=s.discoveries[index];
      if(!camp||!d||index<0||camp.id!=="camp_"+(index+1)||
        (c.routeMode==="legacy"&&index!==position*4)||
        camp.type!=="camp"||ids.has(camp.id)||
        (c.routeMode==="legacy"?
          (camp.x!==d.x+2||camp.z!==d.z+2):
          (Nav.distance(camp,d)<4||Nav.distance(camp,d)>12||
           !world.walkable(camp.x,camp.z)))||
        camp.anchorX!==d.x||camp.anchorZ!==d.z||
        camp.builder!==c.id||!positive(camp.completedAt)||camp.completedAt<d.tick||
        camp.completedAt>tick||camp.completedAt<previous||
        camp.name!=="Refugio de ruta "+(position+1))return false;
      ids.add(camp.id);previous=camp.completedAt;
    }
    const actions=["expedition_arrive","harvest","forage","eat","discover","build_camp",
      "death","meet","assist_work_home","assist_finish_home"];
    const residentActions=["settler_arrive","settler_forage","settler_harvest",
      "settler_eat","settler_build","settler_build_road","settler_home_completed",
      "settler_explore","settler_death","settler_meet"];
    previous=-1;
    for(const e of s.events){
      if(!e||!positive(e.tick)||e.tick>tick||e.tick<previous||
        !(e.actor===c.id&&e.tick>=c.bornAt&&actions.includes(e.action))&&
        !(m&&e.actor===m.id&&e.tick>=m.bornAt&&residentActions.includes(e.action))||
        !e.details||typeof e.details!=="object"||Array.isArray(e.details))return false;
      previous=e.tick;
    }
    return true;
  }
  return Object.freeze({create,advance,advanceSocial,validate,migrateLegacy,migrateV2,migrateV3,migrateV4,migrateV5,snapshot:copy,ROUTE_LENGTH:ROUTE.length});
});
</script>
<script>/* Large-world adapter: keep the existing settlement authoritative in its home
 * clearing; advance wilderness agents on the same clock, independently of camera. */
(function(root,factory){"use strict";const api=factory();
  if(typeof module!=="undefined"&&module.exports)module.exports=api;
  if(root)root.GodseedV3WorldSim=api;

  const node=typeof module!=="undefined"&&module.exports;
  const Society=node?require("./society.js"):globalThis.GodseedV3Society;
  const World=node?require("./world.js"):globalThis.GodseedV3World;
  const Expedition=node?require("./expedition.js"):globalThis.GodseedV3Expedition;
  const VERSION=6,STORAGE_KEY="godseed-v3-large-world-v1",SAVE_LIMIT=1500000;
  const copy=x=>JSON.parse(JSON.stringify(x));
  function instance(homeland,world,expedition){
    let home=homeland.snapshot(),sceneCache=null,sceneKey="";

      const result=copy(home),c=expedition.explorer;
      if(c)result.citizens.push(copy(c));
      result.citizens=result.citizens.concat(copy(expedition.settlers));
      result.structures=result.structures.concat(copy(expedition.camps),copy(expedition.houses));
      result.roads=copy(expedition.roads);
      result.events=result.events.concat(copy(expedition.events)).sort((a,b)=>a.tick-b.tick).slice(-96);
      result.expedition=Expedition.snapshot(expedition);
      result.world={size:World.SIZE,min:World.MIN,max:World.MAX,tileCount:World.SIZE*World.SIZE,
        chunkSize:World.CHUNK,regionSize:World.REGION,regions:256,
        discoveredRegions:expedition.discoveries.length,knownChunks:expedition.knownChunks.length,
        biome:World.terrain(home.seed,c?c.x:5,c?c.z:5).biome,
        homelandCitizens:home.citizens.length,camps:expedition.camps.length,
        frontierResidents:expedition.settlers.length,frontierHomes:expedition.houses.length,
        constructedRoads:expedition.roads.length,
        socialConnections:expedition.social.ties.length,
        activeConstruction:expedition.projects.entries.filter(p=>p.status==="active").length,
        completedWorkOrders:expedition.projects.entries.filter(p=>p.status==="complete").length};

    }
    function advance(n){
      if(!Number.isSafeInteger(n)||n<0||n>20000)throw RangeError("invalid world steps");
      for(let i=0;i<n;i++){
        home=homeland.advance(1);

      const cz=Math.max(World.MIN,Math.min(World.MAX,Math.round(z/4)*4));

      metrics:()=>world.metrics()});

    if(typeof raw!=="string"||raw.length>SAVE_LIMIT)throw RangeError("invalid large-world save");
    const s=JSON.parse(raw);

      s.seed!==s.homeland.seed||!s.wilderness)
      throw RangeError("incompatible large-world save");
    const homeland=Society.restore(JSON.stringify(s.homeland)),tick=homeland.snapshot().tick;
    const world=World.create(s.seed,s.wilderness);
    const expedition=s.schemaVersion===VERSION?s.expedition:
      Expedition.migrateV5(s.schemaVersion===5?s.expedition:
        Expedition.migrateV4(s.schemaVersion===1?Expedition.migrateLegacy(s.expedition):
          s.schemaVersion===2?Expedition.migrateV2(s.expedition):
          s.schemaVersion===3?Expedition.migrateV3(s.expedition):s.expedition),tick);

      !Expedition.validate(expedition,world,tick,s.wilderness.removed.length))

<script>/* Read-only god atlas: moving the camera does not discover regions or spawn NPCs. */

     const wide=store?1.95:workshop?1.8:1.6;
     const walls=workshop?["#929ba2","#687986","#52616e"]:store?["#bfaa76","#998356","#756241"]:["#b99a62","#94734b","#795b3e"];
     const roof=workshop?["#638cb0","#426888","#2e526d"]:store?["#95895b","#756a48","#5b513a"]:["#b75b49","#964638","#77392f"];
     cube(t.x-.25,0,t.z-.15,wide,1.35,1.5,...walls);
     cube(t.x-.39,1.35,t.z-.28,wide+.26,.5,1.76,...roof);
     if(workshop)cube(t.x+1.05,1.75,t.z+.12,.29,.82,.30,"#777a78","#555c5c","#444b49");
     if(store)cube(t.x+.85,.15,t.z+1.36,.38,.42,.06,"#e8cc78","#b99b4f","#937742");
    }else{
     let colors=t.actor.worldExplorer?["#f7d890","#cc9b43","#a47c30"]:
       t.actor.id==="sim_aria"?["#88c0ff","#507fc3","#3968a4"]:
       t.actor.homeId==="village_02"?["#8be0c9","#42b7a5","#288979"]:
       t.actor.id==="sim_bran"?["#f8d785","#c09542","#a87a33"]:["#f0b4d5","#c474a2","#984e7e"];
     cube(t.x+.29,0,t.z+.29,.42,.88,.42,...colors);
     cube(t.x+.25,.88,t.z+.25,.5,.38,.5,"#e9bb8b","#b98a66","#9a6e52");
    }
   }
  }
  return Object.freeze({render,rotate,zoom,pan,focus,camera,mode:"canvas-2d-fallback"});
 }
 return Object.freeze({create});
});

<script>/* GODSEED V3 proof controls: deterministic simulation tick, read-only render, isolated storage. */
(function(root){"use strict";
  const useWorld=/(?:^|[?&])mode=world(?:&|$)/.test(root.location.search||"");
  const useSociety=useWorld||/(?:^|[?&])mode=society(?:&|$)/.test(root.location.search||"");
  const Sim=useWorld?root.GodseedV3WorldSim:useSociety?root.GodseedV3Society:root.GodseedV3Sim;
  const View=root.GodseedV3View,Fallback=root.GodseedV3Fallback;
  if(!Sim||!View||!Fallback)throw new Error("GODSEED V3 modules missing");
  const el=id=>document.getElementById(id);
  let canvas=el("scene");
  let simulation,view=null,rendererMode="unavailable",paused=false,speed=1,last=0,acc=0,dirty=true;
  let lastPersistedTick=-1,lastShownTick=-1,lastDraw=0,status="";
  let atlas=null,atlasOpen=false,followExplorer=false,orbitCamera=false;
  function setStatus(message){status=message;el("headline").textContent=message;}
  function seedNow(){return ((Date.now()>>>0)^0x5a17b913)>>>0;}
  function newWorld(seed){
    simulation=Sim.create(seed===undefined?seedNow():seed);
    if(view&&view.focus)view.focus(9.5,9.5);
    paused=false;acc=0;last=0;lastPersistedTick=-1;lastShownTick=-1;dirty=true;
    el("pause").setAttribute("aria-pressed","false");
    el("pause").textContent="Pausar";
    setStatus(useWorld?"Gran mundo · 1.048.576 casillas · vida autónoma":
      useSociety?"Sociedad autónoma · fabricación y elecciones":"Nuevo mundo autónomo · sin comandos a los Sims");
    update();
    return simulation.snapshot();
  }
  function save(){
    if(!simulation)return false;
    try{
      root.localStorage.setItem(Sim.STORAGE_KEY,simulation.serialize());
      lastPersistedTick=simulation.snapshot().tick;
      setStatus("Mundo guardado localmente · V3 independiente");
      return true;
    }catch(error){
      setStatus("No se pudo guardar: almacenamiento local no disponible");
      return false;
    }
  }
  function load(){
    try{
      const raw=root.localStorage.getItem(Sim.STORAGE_KEY);
      let loaded;
      if(!raw){
        if(!useWorld)return false;
        const societySave=root.localStorage.getItem(root.GodseedV3Society.STORAGE_KEY);
        if(!societySave)return false;
        loaded=Sim.fromSociety(societySave);
      }else loaded=Sim.restore(raw);
      simulation=loaded;
      paused=true;acc=0;last=0;dirty=true;
      lastPersistedTick=simulation.snapshot().tick;lastShownTick=-1;
      el("pause").setAttribute("aria-pressed","true");
      el("pause").textContent="Continuar";
      setStatus(useWorld&&!raw?"Tu aldea se amplió al gran mundo · copia independiente y pausada":"Partida V3 recuperada y pausada");
      update();
      return true;
    }catch(error){
      setStatus("Guardado V3 inválido; sin borrar ni tocar partidas antiguas");
      return "invalid";
    }
  }
  function togglePause(){
    paused=!paused;acc=0;last=0;
    el("pause").setAttribute("aria-pressed",String(paused));
    el("pause").textContent=paused?"Continuar":"Pausar";
    setStatus(paused?"Simulación pausada":"Mundo autónomo en marcha");
    return paused;
  }
  function step(){
    if(!paused)togglePause();
    const result=simulation.advance(1);
    dirty=true;update();
    return result;
  }
  function statsPair(parent,label,value){
    const dt=document.createElement("dt"),dd=document.createElement("dd");
    dt.textContent=label;dd.textContent=String(value);
    parent.appendChild(dt);parent.appendChild(dd);
  }
  function update(){
    if(!simulation)return;
    const state=simulation.snapshot();
    if(lastShownTick!==state.tick){
      const stats=el("stats");stats.textContent="";
      statsPair(stats,"Semilla",state.seed);
      statsPair(stats,"Ciclo",state.tick);
      if(useWorld){
        statsPair(stats,"Mundo",state.world.size+" × "+state.world.size);
        statsPair(stats,"Regiones",state.world.regions);
        statsPair(stats,"Lugares descubiertos",state.world.discoveredRegions);
        statsPair(stats,"Campamentos de ruta",state.world.camps);
        statsPair(stats,"Caminos construidos por NPC",state.world.constructedRoads);
        statsPair(stats,"Vínculos personales",state.world.socialConnections);
        statsPair(stats,"Obras activas",state.world.activeConstruction);
        statsPair(stats,"Órdenes de obra terminadas",state.world.completedWorkOrders);
      }
      statsPair(stats,"Habitantes",state.citizens.length);
      statsPair(stats,useWorld?"Madera de la aldea":"Madera disponible",state.wood);
      statsPair(stats,"Madera recolectada",state.harvested);
      statsPair(stats,"Madera gastada",useSociety?state.spentWood:state.spent);
      statsPair(stats,useSociety?"Edificios terminados":"Refugios construidos",state.structures.length);
      if(useSociety){
        statsPair(stats,"Herramientas",state.axe);
        statsPair(stats,"Kits fabricados",state.kitsCrafted);
        statsPair(stats,"Líder",state.settlement.leaderId||"Sin elegir");
        statsPair(stats,"Elecciones",state.settlement.elections);
        statsPair(stats,"Prioridad del consejo",state.settlement.policy||"none");
        statsPair(stats,"Repartos de oficio",state.settlement.ordersIssued||0);
        statsPair(stats,"Comunidades",state.outpost.status==="established"?2:1);
        statsPair(stats,"Puesto oriental",state.outpost.status);
        statsPair(stats,"Reservas orientales",state.outpost.wood+" madera / "+state.outpost.food+" comida");
        statsPair(stats,"Entregas completadas",state.outpost.deliveries);
      }
      statsPair(stats,useWorld?"Comida de la aldea":"Comida disponible",state.food);
      statsPair(stats,"Bayas recolectadas",state.foodGathered);
      statsPair(stats,"Raciones consumidas",state.foodEaten);
      const people=el("citizens");people.textContent="";
      for(const c of state.citizens){
        const div=document.createElement("div");div.className="person";
        const title=document.createElement("strong");title.textContent=c.name+" · "+c.trait;
        const desc=document.createElement("div");
        if(c.worldExplorer){
          desc.textContent="Objetivo: "+c.goal+" | Posición "+c.x+", "+c.z+
            " | Salud "+c.health+"/100 | Saciedad "+c.hunger+"/100 | Energía "+c.energy+
            "/20 | Mochila: "+c.food+" comida / "+c.wood+" madera | Regiones visitadas "+c.routeIndex;
        }else if(c.worldSettler){
          desc.textContent="Objetivo: "+c.goal+" | Posición "+c.x+", "+c.z+
            " | Salud "+c.health+"/100 | Saciedad "+c.hunger+"/100"+
            " | Energía "+c.energy+"/20 | Mochila "+c.food+" comida / "+
            c.wood+" madera | Campamento "+c.homeCampId+
            (c.mind?" | Decisión "+(c.mind.lastChoice||"considerando opciones")+
            " | Curiosidad "+c.mind.preferences.curiosity+
            " | Seguridad "+c.mind.preferences.security+
            " | Memorias "+c.mind.memories.length:"");
        }else if(c.mind){
          const mind=c.mind;
          desc.textContent="Objetivo: "+c.goal+
            " | Salud "+c.health+"/100 | Hambre "+c.hunger+"/100 | Energía "+c.energy+"/20"+
            " | Ánimo "+mind.emotions.contentment+"/100 | Estrés "+mind.emotions.stress+"/100"+
            " | Curiosidad "+mind.personality.curiosity+"/100 | Prudencia "+mind.personality.caution+"/100"+
            " | Experiencia recolectando "+mind.skills.foraging+"/100"+
            " | Lugares conocidos "+mind.visited.length+" | Recuerdos "+mind.memories.length;
        }else{
          desc.textContent="Objetivo: "+c.goal+" | Salud "+c.health+"/100 | Hambre "+c.hunger+
            "/100 | Energía "+c.energy+"/20 | Fabricaciones "+c.crafted+
            " | Construcciones "+c.built+" | Conversaciones "+c.conversations+
            " | Oficio "+c.role+" | Tareas de oficio "+c.ordersCompleted+
            " | Comunidad "+c.homeId+
            " | Comida recolectada "+c.foraged+" | Recuerdos "+c.memories.length+
            (state.settlement.leaderId===c.id?" | Líder elegido":"");
        }
        div.appendChild(title);div.appendChild(desc);people.appendChild(div);
      }
      const events=el("events");events.textContent="";
      const memoryPanel=el("memories");memoryPanel.textContent="";
      if(useSociety){
        el("memories").previousElementSibling.textContent="Consejo de la aldea";
        const council=state.settlement;
        const div=document.createElement("div");
        div.textContent="Líder: "+(council.leaderId||"ninguno")+
          " | Votos: "+council.ballots.map(b=>b.voter+" → "+b.candidate).join(", ");
        memoryPanel.appendChild(div);
        const policy=document.createElement("div");
        policy.textContent="Prioridad: "+council.policy+" | Evidencia: "+council.policyReason;
        memoryPanel.appendChild(policy);
        for(const person of state.citizens){
          if(person.worldExplorer||person.worldSettler)continue;
          const note=document.createElement("div");
          const latest=person.memories.length?person.memories[person.memories.length-1]:null;
          note.textContent=person.name+" · "+person.role+" · "+person.ordersCompleted+
            " tareas · recuerdo: "+(latest?latest.kind+" (ciclo "+latest.tick+")":"sin recuerdos");
          memoryPanel.appendChild(note);
        }
        if(useWorld){
          const note=document.createElement("div");
          const discoveries=state.expedition.discoveries;
          note.textContent=state.expedition.explorer?
            "Expedición: "+discoveries.length+" lugares. "+(discoveries.length?"Último: "+discoveries[discoveries.length-1].name:""):
            "Un cartógrafo llegará cuando exista un taller y transcurran 600 ciclos.";
          memoryPanel.appendChild(note);
        }
      }else{
        const mind=state.citizens[0].mind;
        const memoryLabels={build:"Su primer refugio",forage:"Encontró comida",
          eat:"Su primera comida",discover:"Descubrió un lugar",
          reflect:"Pensó en su hogar",hardship:"Pasó hambre"};
        for(const entry of mind.memories.slice(-4).reverse()){
          const div=document.createElement("div");
          div.textContent="Ciclo "+entry.tick+" · "+(memoryLabels[entry.kind]||entry.kind);
          memoryPanel.appendChild(div);
        }
      }
      for(const e of state.events.slice(-6).reverse()){
        const div=document.createElement("div");
        const labels={build:"construyó edificio",harvest:"recolectó madera",
          forage:"recolectó bayas",eat:"comió",rest:"descansó",
          discover:"descubrió un lugar",reflect:"reflexionó",hardship:"pasó hambre",
          craft:"fabricó "+(e.details.recipe||"objeto"),
          talk:"conversó con "+(e.details.with||"otro habitante"),
          arrive:"llegó a la aldea",elect:"fue elegido líder",death:"falleció",
          assign:"recibió oficio "+(e.details.role||""),
          council:"decidió priorizar "+(e.details.policy||""),
          approve_outpost:"aprobó fundación de otra comunidad",
          found_outpost:"fundó Colina Oriental",
          dispatch:"despachó provisiones",deliver:"entregó alimentos",
          expedition_arrive:"llegó para explorar el gran mundo",
          build_camp:"construyó un refugio de ruta",
          settler_arrive:"llegó al campamento",
          settler_harvest:"cosechó madera silvestre",
          settler_forage:"recolectó comida silvestre",
          settler_eat:"consumió provisiones",
          settler_build:"construyó su propia casa",
          settler_build_road:"construyó un tramo de camino",
          settler_death:"falleció en la frontera"};
        div.textContent="Ciclo "+e.tick+" · "+e.actor+": "+(labels[e.action]||e.action)+
          (e.action==="build"&&e.details.site?" ("+e.details.site+")":"")+
          (e.action==="discover"&&e.details.name?" · "+e.details.name:"");
        events.appendChild(div);
      }
      lastShownTick=state.tick;
    }
    if(view){
      const factor=Math.min(root.devicePixelRatio||1,1.25);
      const w=Math.max(1,Math.floor(canvas.clientWidth*factor));
      const h=Math.max(1,Math.floor(canvas.clientHeight*factor));
      if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;dirty=true;}
      if(dirty){
        if(useWorld){
          if(followExplorer){const target=state.expedition.explorer||state.citizens[0];view.focus(target.x,target.z);}
          const camera=view.camera(),region=simulation.region(camera.x,camera.z);
          el("hint").textContent=region.name+" · "+Math.round(camera.x)+", "+Math.round(camera.z)+
            " · "+(orbitCamera?"Arrastra para girar":"Arrastra para viajar con la cámara");
          view.render(simulation.scene(camera.x,camera.z,camera.half));
          if(atlasOpen&&atlas)atlas.render(state,camera);
        }else view.render(state);
        dirty=false;
      }
    }
  }
  function loop(now){
    if(!last)last=now;
    const elapsed=Math.max(0,Math.min(250,now-last));last=now;
    if(!paused&&simulation){
      acc+=elapsed*speed;
      const steps=Math.min(18,Math.floor(acc/450));
      if(steps){
        acc-=steps*450;simulation.advance(steps);dirty=true;
        const tick=simulation.snapshot().tick;
        if(tick-lastPersistedTick>=35)save();
      }
    }
    if(dirty||now-lastDraw>450){update();lastDraw=now;}
    root.requestAnimationFrame(loop);
  }
  function controls(){
    el("pause").addEventListener("click",togglePause);
    el("step").addEventListener("click",step);
    el("speed").addEventListener("click",function(){
      speed=speed===1?4:speed===4?12:1;el("speed").textContent="Velocidad ×"+speed;
    });
    el("zoomIn").addEventListener("click",()=>{if(view){view.zoom(-3);dirty=true;}});
    el("zoomOut").addEventListener("click",()=>{if(view){view.zoom(3);dirty=true;}});
    el("save").addEventListener("click",save);
    function switchMode(mode){
      if(!save())return;
      root.location.search="mode="+mode+(rendererMode==="canvas-2d-fallback"?"&renderer=2d":"");
    }
    el("mode").textContent=useSociety?"Modo Aria sola":"Modo sociedad";
    el("mode").addEventListener("click",function(){
      // Switching simulations reloads the page and never touches the other save key.
      switchMode(useSociety?"solo":"society");
    });
    el("largeWorld").textContent=useWorld?"Aldea local":"Gran mundo";
    el("largeWorld").addEventListener("click",()=>switchMode(useWorld?"society":"world"));
    function setAtlas(open){
      atlasOpen=open;el("atlas").style.display=open?"flex":"none";
      el("atlasToggle").setAttribute("aria-expanded",String(open));dirty=true;
      if(open)el("atlasClose").focus();
    }
    function stopFollowing(){followExplorer=false;el("followExplorer").setAttribute("aria-pressed","false");}
    if(useWorld){
      el("worldTools").style.display="flex";
      atlas=root.GodseedV3Atlas.create(el("atlasMap"),(x,z)=>{
        if(view){stopFollowing();view.focus(x,z);setAtlas(false);dirty=true;}
      });
      el("atlasToggle").addEventListener("click",()=>setAtlas(!atlasOpen));
      el("atlasClose").addEventListener("click",()=>setAtlas(false));
      el("homeCamera").addEventListener("click",()=>{
        if(view){stopFollowing();view.focus(9.5,9.5);dirty=true;}
      });
      el("followExplorer").addEventListener("click",()=>{
        followExplorer=!followExplorer;el("followExplorer").setAttribute("aria-pressed",String(followExplorer));dirty=true;
      });
      el("orbitCamera").addEventListener("click",()=>{
        orbitCamera=!orbitCamera;el("orbitCamera").setAttribute("aria-pressed",String(orbitCamera));
        el("orbitCamera").textContent=orbitCamera?"Cámara: girar":"Cámara: desplazar";dirty=true;
      });
    }
    el("reset").addEventListener("click",function(){
      try{root.localStorage.removeItem(Sim.STORAGE_KEY);}catch(error){}
      newWorld();
    });
    let lastPointer=null;
    canvas.addEventListener("pointerdown",function(e){
      lastPointer={id:e.pointerId,x:e.clientX,y:e.clientY};
      try{canvas.setPointerCapture(e.pointerId);}catch(error){}
    });
    canvas.addEventListener("pointermove",function(e){
      if(!lastPointer||lastPointer.id!==e.pointerId||!view)return;
      const dx=(e.clientX-lastPointer.x)/Math.max(100,canvas.clientWidth),
        dy=(e.clientY-lastPointer.y)/Math.max(100,canvas.clientHeight);
      if(useWorld&&!orbitCamera&&!e.shiftKey){stopFollowing();view.pan(dx,dy);}
      else view.rotate(dx,dy);
      lastPointer.x=e.clientX;lastPointer.y=e.clientY;dirty=true;
    });
    for(const type of ["pointerup","pointercancel","lostpointercapture"])
      canvas.addEventListener(type,()=>{lastPointer=null;});
    canvas.addEventListener("wheel",function(e){e.preventDefault();if(view){view.zoom(Math.sign(e.deltaY)*2);dirty=true;}},{passive:false});
    root.addEventListener("pagehide",save);
    document.addEventListener("visibilitychange",function(){
      if(document.hidden){if(!paused)togglePause();save();}
    });
    root.addEventListener("keydown",function(e){
      if(e.key==="Escape"){setAtlas(false);return;}
      if(e.target&&/^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
      if(useWorld&&view&&["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){
        e.preventDefault();stopFollowing();const camera=view.camera();
        view.focus(camera.x+(e.key==="ArrowLeft"?-8:e.key==="ArrowRight"?8:0),
          camera.z+(e.key==="ArrowUp"?-8:e.key==="ArrowDown"?8:0));dirty=true;return;
      }
      if(e.code==="Space"){e.preventDefault();togglePause();}
      if(view&&e.key==="ArrowLeft"){view.rotate(-.12,0);dirty=true;}
      if(view&&e.key==="ArrowRight"){view.rotate(.12,0);dirty=true;}
    });
  }
  const forceFallback=Boolean(root.location&&((root.location.search||"").indexOf("renderer=2d")>=0));
  try{
    if(forceFallback)throw new Error("Canvas2D QA");
    view=View.create(canvas);rendererMode="webgl-3d";
  }catch(error){
    // After a partial shader initialization a WebGL canvas cannot become 2D.
    // Replace canvas before binding movement and creating the fallback context.
    const replacement=canvas.cloneNode(false);
    canvas.parentNode.replaceChild(replacement,canvas);
    canvas=replacement;
    try{
      view=Fallback.create(canvas);rendererMode="canvas-2d-fallback";
    }catch(fallbackError){
      const warning=el("warning");warning.style.display="block";
      warning.textContent="WebGL y Canvas2D no están disponibles; la simulación continúa sin imagen.";
    }
  }
  controls();
  // Invalid saves remain on disk untouched until the player explicitly resets.
  if(load()===false)newWorld(14);
  if(rendererMode==="canvas-2d-fallback")setStatus("Modo compatible 2.5D · WebGL no disponible");
  // Public test/inspection interface; never exposes a writable simulation object.
  root.GodseedV3Debug=Object.freeze({
    getState:()=>simulation.snapshot(),newWorld,step,save,load,
    fastForward:(n)=>{
      if(!paused)togglePause();
      const result=simulation.advance(n);dirty=true;update();return result;
    },
    isPaused:()=>paused,pause:()=>{if(!paused)togglePause();return true;},
    resume:()=>{if(paused)togglePause();return true;},
    hasWebGL:()=>rendererMode==="webgl-3d",rendererMode:()=>rendererMode,storageKey:Sim.STORAGE_KEY,
    mode:()=>useWorld?"world":useSociety?"society":"solo",
    worldMetrics:()=>useWorld?simulation.metrics():null,
    camera:()=>view&&view.camera?view.camera():null,
    observe:(x,z)=>{if(useWorld&&view){followExplorer=false;view.focus(x,z);dirty=true;update();}}
  });
  root.requestAnimationFrame(loop);
})(typeof window!=="undefined"?window:globalThis);
</script>
