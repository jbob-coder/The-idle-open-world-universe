name: GODSEED native Android evaluation
on:
  push:
    branches:
      - feat/godseed-android-storage-host
  pull_request:
    paths:
      # The native APK embeds the built offline simulator and pixel atlases.
      # Gameplay-only changes must also exercise the actual Gradle/WebView host.
      - 'src/**'
      - 'data/**'
      - 'assets/generated/**'
      - 'assets/asset-manifest.json'
      - 'build.py'
      - 'scripts/generate_starter_assets.mjs'
      - 'android/gradle/**'
      - 'tests/native/**'
      - 'assets/packs/**'
      - 'scripts/make_sample_lore_pack.py'
      - 'index.template.html'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:
jobs:
  gradle-webview-and-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Unit-test exact-SHA emulator evidence validation
        run: python -m unittest discover -s tests/native -p 'test_android_emulator_evidence.py' -v
      - name: Verify opt-in storage boundaries and deterministic offline pack
        run: sh tests/native/run-storage-checks.sh
      - name: Build offline HTML bundle (keep file-origin save identity)
        run: python build.py
      - name: Install Android API 35 without legacy sdkmanager tools package
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDKROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build separate debug Gradle/WebView host
        run: gradle -p android/gradle :app:assembleDebug :app:assembleAndroidTest --no-daemon --stacktrace
      - name: Verify local asset content and avoid INTERNET/broad storage permissions
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          apk=Path('android/gradle/app/build/outputs/apk/debug/app-debug.apk')
          assert apk.is_file(),apk
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert 'assets/index.html' in z.namelist()
              assert z.read('assets/index.html')==Path('GODSEED-Play.html').read_bytes()
              assert any(n.startswith('classes') and n.endswith('.dex') for n in z.namelist())
          print('PASS Gradle APK embeds exact offline HTML',apk.stat().st_size,'bytes')
          PY
          ! grep -RiE 'android.permission.(INTERNET|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE)' android/gradle/app/src/main/AndroidManifest.xml
      - name: Publish separate native evaluation APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: godseed-gradle-webview-native-evaluation
          path: |
            android/gradle/app/build/outputs/apk/debug/app-debug.apk
            android/gradle/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 14
          if-no-files-found: error

  emulator-launch-and-pack-install:
    needs: gradle-webview-and-storage
    runs-on: ubuntu-latest
    timeout-minutes: 38
    permissions:
      contents: read
    env:
      GODSEED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GODSEED_TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: godseed-gradle-webview-native-evaluation
          path: android/gradle/app/build/outputs/apk
      - name: Move downloaded APKs to their normal relative locations
        shell: bash
        run: |
          mkdir -p android/gradle/app/build/outputs/apk/debug
          mkdir -p android/gradle/app/build/outputs/apk/androidTest/debug
          find android/gradle/app/build/outputs/apk -maxdepth 4 -type f -name '*.apk' -print
          if [ -f android/gradle/app/build/outputs/apk/app-debug.apk ]; then
            mv android/gradle/app/build/outputs/apk/app-debug.apk android/gradle/app/build/outputs/apk/debug/
          fi
          if [ -f android/gradle/app/build/outputs/apk/app-debug-androidTest.apk ]; then
            mv android/gradle/app/build/outputs/apk/app-debug-androidTest.apk android/gradle/app/build/outputs/apk/androidTest/debug/
          fi
          test -s android/gradle/app/build/outputs/apk/debug/app-debug.apk
          test -s android/gradle/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Enable KVM on GitHub-hosted Linux runner when available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash tests/native/run-emulator-acceptance.sh
      - name: Publish emulator-only install, screenshot and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godseed-native-android-emulator-smoke
          retention-days: 14
          if-no-files-found: warn
          path: |
            qa-screenshots/android-emulator-instrumentation.txt
            qa-screenshots/android-emulator-skyworld.png
            qa-screenshots/android-emulator-memory.txt
            qa-screenshots/android-emulator-logcat.txt
            qa-screenshots/android-emulator-evidence.json
