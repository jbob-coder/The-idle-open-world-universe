name: GODSEED sky view Android landscape captures
on:
  push:
    branches:
      - feat/godseed-medieval-skyworld-v1
      - feat/skyview-zoom-v0.4
    paths:
      - 'src/**'
      - 'index.template.html'
      - 'tests/capture_android_layouts.py'
      - '.github/workflows/visual-smoke.yml'
  workflow_dispatch:
jobs:
  browser-landscape-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies (not game dependencies)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build exact offline game HTML
        run: python build.py
      - name: Capture landscape screens and test divine touch
        run: python tests/capture_android_layouts.py
      - name: Publish browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godseed-skyview-browser-captures
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 14
