name: GODSEED V3 offline 3D proof
on:
  push:
    paths:
      - 'src/v3/**'
      - 'v3/**'
      - 'build_v3.py'
      - 'GODSEED-V3-Play.html'
      - 'tests/v3_sim.test.js'
      - 'tests/v3_browser_acceptance.py'
      - '.github/workflows/v3-3d-proof.yml'
  pull_request:
    paths:
      - 'src/v3/**'
      - 'v3/**'
      - 'build_v3.py'
      - 'GODSEED-V3-Play.html'
      - 'tests/v3_sim.test.js'
      - 'tests/v3_browser_acceptance.py'
      - '.github/workflows/v3-3d-proof.yml'
  workflow_dispatch:
jobs:
  v3-offline-webgl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JavaScript syntax and simulate 100 seeds
        run: |
          node --check src/v3/sim.js
          node --check src/v3/view.js
          node --check src/v3/app.js
          node --test tests/v3_sim.test.js
      - name: Rebuild self-contained V3 HTML and verify committed artifact
        run: |
          python build_v3.py
          git diff --exit-code -- GODSEED-V3-Play.html
      - name: Install offline Chromium test runner
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test actual offline WebGL, autonomous shelter, 2 viewports and save/reload
        run: python tests/v3_browser_acceptance.py
      - name: Preserve V3 HTML and real Chromium screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: godseed-v3-offline-webgl-preview
          if-no-files-found: error
          retention-days: 30
          path: |
            GODSEED-V3-Play.html
            qa-screenshots/godseed-v3-chromium-960x540.png
            qa-screenshots/godseed-v3-chromium-640x360.png
