name: GODSEED offline QA
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  simulation-and-android-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build offline HTML
        run: python build.py
      - name: Run deterministic simulation tests
        run: node --test tests/sim.test.js
      - name: Rebuild debug APK with temporary CI signing key
        run: python android/build_apk.py
      - name: Check APK structure and signature
        run: python tests/test_android_package.py
      - name: Verify private signing key is excluded from Git
        run: '! git ls-files | grep -E "(android/debug-only/|\\.(jks|keystore|p12)$)"'
