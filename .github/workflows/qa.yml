name: GODSEED offline QA
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  simulation-and-android-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build offline HTML
        run: python build.py
      - name: Run deterministic simulation tests
        run: |
          node --check src/sim.js
          node --check src/ui.js
          node --test tests/*.test.js
      - name: Verify Codex starter-art contract and reproducibility
        run: |
          node scripts/validate_asset_manifest.mjs
          node scripts/validate_pixel_art_contract.mjs
          node scripts/validate_world_blueprint.mjs
          node scripts/validate_hardware_budget.mjs
          node scripts/validate_storage_budget.mjs
          node scripts/generate_starter_assets.mjs
          git diff --exit-code -- assets/generated/
          node scripts/validate_asset_manifest.mjs
      - name: Rebuild debug APK with temporary CI signing key
        run: python android/build_apk.py
      - name: Check APK structure and signature
        run: python tests/test_android_package.py

      - name: Prepare browser smoke tests (CI only; no APK dependency)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify mobile layout, divine touch powers, backups and offline operation
        run: |
          python tests/browser_smoke.py
          python tests/mobile_acceptance.py
          python tests/lifecycle_acceptance.py
          python tests/chapter_browser_acceptance.py
          python tests/chapter_two_browser_acceptance.py
          python tests/capture_android_layouts.py
          python tests/native_storage_ui_acceptance.py
      - name: Preserve v1 APK and actual browser screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: godseed-v1-skyview-android-prototype
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/GODSEED-v1-experimental.apk
            dist/manifest.json
            qa-screenshots/
            assets/screenshot-720x400.png
            assets/godseed-android-landscape-640x360.png
            assets/godseed-android-landscape-720x400.png
            assets/godseed-android-landscape-960x540.png
      - name: Verify private signing key is excluded from Git
        run: '! git ls-files | grep -E "(android/debug-only/|\\.(jks|keystore|p12)$)"'
